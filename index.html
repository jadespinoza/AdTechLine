<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTech POS - Cafetería & Menú del Día</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#38bdf8',
                            DEFAULT: '#0284c7',
                            dark: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <!-- Componentes modulares reutilizables -->
    <script type="text/babel" src="./js/components/ClienteFormulario.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionDatos.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionGeneral.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Base de Datos Simula DGII
        const padronDGII = [
            { rnc: '101010101', nombre: 'JUAN PEREZ SOLUCIONES SRL', tipo: 'RNC' },
            { rnc: '00112345678', nombre: 'CARLOS GOMEZ', tipo: 'CEDULA' },
            { rnc: '130999888', nombre: 'INVERSIONES ADTECH SRL', tipo: 'RNC' }
        ];

        // Componentes de Iconos auxiliares
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        function App() {
            // Estados de Configuración y Tema
            const [theme, setTheme] = useState(localStorage.getItem('adtech_theme') || 'light');
            const [activeTab, setActiveTab] = useState('pos');
            const [configSubTab, setConfigSubTab] = useState('general'); // 'general' | 'datos'
            const [itbisRate, setItbisRate] = useState(18);

            // Datos de Empresa / Negocio
            const [negocioConfig, setNegocioConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_negocio_config');
                return saved ? JSON.parse(saved) : {
                    nombreNegocio: 'Cafetería & Restaurant AdTech',
                    rnc: '130999888',
                    telefono: '(809) 555-0192',
                    direccion: 'Santo Domingo, R.D.',
                    moneda: 'RD$',
                    itbis: 18,
                    tema: 'light',
                    pieFactura: '¡Gracias por su compra en AdTech!'
                };
            });

            // Fecha actual del menú
            const [menuDate, setMenuDate] = useState(new Date().toISOString().split('T')[0]);

            // Elementos disponibles para el Menú del Día
            const [menuDiaConfig, setMenuDiaConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_menu_dia_config');
                return saved ? JSON.parse(saved) : {
                    arroces: [
                        { id: 'ar1', nombre: 'Arroz blanco', disponible: true },
                        { id: 'ar2', nombre: 'Arroz Moro', disponible: true },
                        { id: 'ar3', nombre: 'Arroz Amarillo', disponible: true },
                        { id: 'ar4', nombre: 'Locrio', disponible: true }
                    ],
                    carnes: [
                        { id: 'c1', nombre: 'Pollo frito', disponible: true },
                        { id: 'c2', nombre: 'Pollo guisado', disponible: true },
                        { id: 'c3', nombre: 'Cerdo', disponible: true },
                        { id: 'c4', nombre: 'Costilla', disponible: true },
                        { id: 'c5', nombre: 'Chuleta', disponible: true },
                        { id: 'c6', nombre: 'Res', disponible: false }
                    ],
                    ensaladas: [
                        { id: 'e1', nombre: 'Verde', disponible: true },
                        { id: 'e2', nombre: 'Rusa', disponible: true },
                        { id: 'e3', nombre: 'Colleslaw', disponible: true }
                    ],
                    extras: [
                        { id: 'x1', nombre: 'Plátano frito', disponible: true },
                        { id: 'x2', nombre: 'Arepa frita', disponible: true },
                        { id: 'x3', nombre: 'Berenjena', disponible: true }
                    ],
                    precioBase: 200
                };
            });

            // Productos e Inventario
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('adtech_products');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Coca-Cola', costo: 25, venta: 35, categoria: 'Refrescos', disponible: true, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' },
                    { id: '2', nombre: 'Plato del Día', costo: 120, venta: 200, categoria: 'Platos', esPlatoDia: true, disponible: true, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300' },
                    { id: '3', nombre: 'Jugo Natural Chinola', costo: 30, venta: 60, categoria: 'Bebidas', disponible: true, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300' },
                    { id: '4', nombre: 'Tres Leches', costo: 50, venta: 100, categoria: 'Postres', disponible: true, img: 'https://images.unsplash.com/photo-1587314168485-3236d6710814?w=300' }
                ];
            });

            // Clientes y Proveedores
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('adtech_clients');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Consumidor Final', rnc: '', cxc: 0 },
                    { id: '2', nombre: 'Empresa ABC SRL', rnc: '101010101', cxc: 450 }
                ];
            });

            const [suppliers, setSuppliers] = useState(() => {
                const saved = localStorage.getItem('adtech_suppliers');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Distribuidora Corripio', rnc: '101888777', cxp: 1200 }
                ];
            });

            // Carrito y Facturación
            const [cart, setCart] = useState([]);
            const [selectedClient, setSelectedClient] = useState('1');
            const [paymentMethod, setPaymentMethod] = useState('Efectivo');
            const [ncfType, setNcfType] = useState('B02');
            const [discount, setDiscount] = useState(0);

            // Modales
            const [showPlatoModal, setShowPlatoModal] = useState(false);
            const [platoConfig, setPlatoConfig] = useState({
                principal: '',
                carne: '',
                ensalada: '',
                extra: '',
                precio: 200
            });

            const [showReceipt, setShowReceipt] = useState(false);
            const [lastInvoice, setLastInvoice] = useState(null);

            // Modales de Administración
            const [showClientModal, setShowClientModal] = useState(false);
            const [showSupplierModal, setShowSupplierModal] = useState(false);
            const [newSupplier, setNewSupplier] = useState({ nombre: '', rnc: '' });
            
            // Estado para Nuevo / Editar Producto
            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [productForm, setProductForm] = useState({
                nombre: '',
                costo: 0,
                venta: 0,
                categoria: 'Bebidas',
                img: ''
            });

            // Persistencia
            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('adtech_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('adtech_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('adtech_clients', JSON.stringify(clients));
            }, [clients]);

            useEffect(() => {
                localStorage.setItem('adtech_menu_dia_config', JSON.stringify(menuDiaConfig));
            }, [menuDiaConfig]);

            // Lógica Plato del Día
            const isLocrio = platoConfig.principal && platoConfig.principal.toLowerCase().includes('locrio');

            const handleAddPlatoDia = () => {
                if (!platoConfig.principal) {
                    return alert('Por favor seleccione el arroz / plato principal.');
                }
                if (!isLocrio && !platoConfig.carne) {
                    return alert('Por favor seleccione una carne.');
                }
                
                const desc = `Plato del Día (${menuDate}): ${platoConfig.principal}${isLocrio ? '' : ', Carne: ' + platoConfig.carne}${platoConfig.ensalada ? ', Ensalada: ' + platoConfig.ensalada : ''}${platoConfig.extra ? ', Extra: ' + platoConfig.extra : ''}`;
                const item = {
                    id: 'plato-' + Date.now(),
                    nombre: desc,
                    precio: Math.max(menuDiaConfig.precioBase, Number(platoConfig.precio)),
                    cantidad: 1,
                    esCustom: true
                };
                setCart([...cart, item]);
                setShowPlatoModal(false);
            };

            const addToCart = (product) => {
                if (product.esPlatoDia) {
                    const primerArroz = menuDiaConfig.arroces.find(a => a.disponible)?.nombre || '';
                    const primeraCarne = menuDiaConfig.carnes.find(c => c.disponible)?.nombre || '';
                    const primeraEnsalada = menuDiaConfig.ensaladas.find(e => e.disponible)?.nombre || '';
                    const primerExtra = menuDiaConfig.extras.find(x => x.disponible)?.nombre || '';

                    setPlatoConfig({
                        principal: primerArroz,
                        carne: primeraCarne,
                        ensalada: primeraEnsalada,
                        extra: primerExtra,
                        precio: menuDiaConfig.precioBase
                    });
                    setShowPlatoModal(true);
                    return;
                }
                const existing = cart.find(c => c.id === product.id);
                if (existing) {
                    setCart(cart.map(c => c.id === product.id ? { ...c, cantidad: c.cantidad + 1 } : c));
                } else {
                    setCart([...cart, { id: product.id, nombre: product.nombre, precio: product.venta, cantidad: 1 }]);
                }
            };

            // Borrar Factura Completa
            const handleClearInvoice = () => {
                if (cart.length === 0) {
                    return alert('El carrito ya está vacío.');
                }
                if (confirm('¿Está seguro de que desea borrar la factura completa? Se perderán todos los ítems agregados.')) {
                    setCart([]);
                    setDiscount(0);
                    setSelectedClient('1');
                    setPaymentMethod('Efectivo');
                }
            };

            // Manejo de carga de imagen local
            const handleImageFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProductForm(prev => ({ ...prev, img: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const openNewProductModal = () => {
                setEditingProductId(null);
                setProductForm({ nombre: '', costo: 0, venta: 0, categoria: 'Bebidas', img: '' });
                setShowProductModal(true);
            };

            const openEditProductModal = (prod) => {
                setEditingProductId(prod.id);
                setProductForm({
                    nombre: prod.nombre,
                    costo: prod.costo,
                    venta: prod.venta,
                    categoria: prod.categoria || 'Bebidas',
                    img: prod.img || ''
                });
                setShowProductModal(true);
            };

            const handleSaveProduct = () => {
                if (!productForm.nombre) return alert('Ingrese el nombre del producto.');
                if (editingProductId) {
                    setProducts(products.map(p => p.id === editingProductId ? { ...p, ...productForm } : p));
                } else {
                    const newProd = {
                        id: Date.now().toString(),
                        ...productForm,
                        disponible: true
                    };
                    setProducts([...products, newProd]);
                }
                setShowProductModal(false);
            };

            // Guardar cliente desde formulario DGII
            const handleGuardarNuevoCliente = (nuevoClienteObj) => {
                setClients([...clients, nuevoClienteObj]);
                setSelectedClient(nuevoClienteObj.id);
                setShowClientModal(false);
            };

            // Cálculos
            const subtotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const discountAmount = (subtotal * discount) / 100;
            const subtotalNeto = subtotal - discountAmount;
            const itbis = subtotalNeto * (itbisRate / 100);
            const total = subtotalNeto + itbis;

            // Facturar
            const handleFacturar = () => {
                if (cart.length === 0) return alert('El carrito está vacío');
                const clientObj = clients.find(c => c.id === selectedClient) || { nombre: 'Cliente General' };
                
                const invoice = {
                    id: 'FAC-' + Math.floor(100000 + Math.random() * 900000),
                    ncf: ncfType + '00000123',
                    fecha: new Date().toLocaleString(),
                    cliente: clientObj.nombre,
                    rnc: clientObj.rnc,
                    metodoPago: paymentMethod,
                    items: [...cart],
                    subtotal,
                    discountAmount,
                    itbis,
                    total
                };

                if (paymentMethod === 'Credito') {
                    setClients(clients.map(c => c.id === selectedClient ? { ...c, cxc: c.cxc + total } : c));
                }

                setLastInvoice(invoice);
                setShowReceipt(true);
                setCart([]);
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header TopBar */}
                    <header class="bg-sky-500 dark:bg-slate-800 text-white p-4 shadow-lg flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="bg-white text-sky-600 font-black px-3 py-1 rounded-xl text-xl shadow">AdTech</div>
                            <span class="text-xs sm:text-sm font-light text-sky-100 border-l pl-3 border-sky-400">
                                {negocioConfig.nombreNegocio || 'Sistema POS Cafetería'}
                            </span>
                        </div>
                        
                        <div class="flex items-center space-x-3">
                            <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Cambiar Tema">
                                <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                            </button>
                            <button onClick={() => setActiveTab('config')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Configuración">
                                <Icon name="settings" size={20} />
                            </button>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 flex space-x-4 overflow-x-auto">
                        {[
                            { id: 'pos', label: 'Facturación / POS', icon: 'shopping-cart' },
                            { id: 'menudia', label: 'Menú del Día (Disponibilidad)', icon: 'utensils' },
                            { id: 'inventory', label: 'Inventario & Productos', icon: 'grid' },
                            { id: 'clients', label: 'Clientes & CxC', icon: 'users' },
                            { id: 'suppliers', label: 'Proveedores & CxP', icon: 'truck' },
                            { id: 'config', label: 'Configuración & Datos', icon: 'settings' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center space-x-2 py-3 px-4 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${
                                    activeTab === tab.id
                                        ? 'border-sky-500 text-sky-600 dark:text-sky-400 font-bold'
                                        : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
                                }`}
                            >
                                <Icon name={tab.icon} size={16} />
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Main Layout */}
                    <main class="flex-1 p-4 max-w-7xl w-full mx-auto">
                        {/* TAB 1: POS FACTURACIÓN */}
                        {activeTab === 'pos' && (
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <div class="lg:col-span-7 flex flex-col space-y-4">
                                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                        <h2 class="font-bold text-lg text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                            <Icon name="grid" size={20} /> Productos Disponibles
                                        </h2>
                                        <span class="text-xs bg-sky-100 text-sky-800 dark:bg-sky-900 dark:text-sky-200 font-semibold px-2.5 py-1 rounded-full">
                                            {products.filter(p => p.disponible).length} Items
                                        </span>
                                    </div>

                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        {products.filter(p => p.disponible).map(product => (
                                            <button
                                                key={product.id}
                                                onClick={() => addToCart(product)}
                                                className="group relative bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-md hover:shadow-xl transition transform active:scale-95 border border-slate-200 dark:border-slate-700 flex flex-col text-left"
                                            >
                                                <div class="h-28 w-full overflow-hidden bg-slate-100 relative">
                                                    <img src={product.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300'} alt={product.nombre} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                                                    {product.esPlatoDia && (
                                                        <span class="absolute top-2 right-2 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow">Armar Plato</span>
                                                    )}
                                                </div>
                                                <div class="p-3 flex flex-col justify-between flex-1 w-full">
                                                    <span class="font-semibold text-slate-800 dark:text-slate-100 text-sm line-clamp-1">{product.nombre}</span>
                                                    <div class="flex justify-between items-center mt-2">
                                                        <span class="text-xs font-semibold text-sky-600 dark:text-sky-400">
                                                            {negocioConfig.moneda || 'RD$'} {product.esPlatoDia ? menuDiaConfig.precioBase.toFixed(2) : product.venta.toFixed(2)}
                                                        </span>
                                                        <span class="bg-sky-50 dark:bg-slate-700 text-sky-600 dark:text-sky-300 p-1.5 rounded-lg group-hover:bg-sky-500 group-hover:text-white transition">
                                                            <Icon name="plus" size={14} />
                                                        </span>
                                                    </div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="lg:col-span-5 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between">
                                    <div class="space-y-4">
                                        <div class="border-b border-slate-200 dark:border-slate-700 pb-4 space-y-3">
                                            <div class="flex justify-between items-center">
                                                <h2 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                                    <span>Detalle de Factura</span>
                                                </h2>
                                                {cart.length > 0 && (
                                                    <button
                                                        onClick={handleClearInvoice}
                                                        className="bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-red-200 dark:border-red-800 transition flex items-center gap-1 shadow-sm"
                                                        title="Borrar factura completa"
                                                    >
                                                        <Icon name="trash-2" size={14} />
                                                        <span>Borrar Factura</span>
                                                    </button>
                                                )}
                                            </div>

                                            <div>
                                                <div class="flex justify-between items-center mb-1">
                                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400">Cliente</label>
                                                    <button onClick={() => setShowClientModal(true)} className="text-[11px] text-sky-600 hover:underline font-bold">
                                                        + Verificar / Nuevo Cliente
                                                    </button>
                                                </div>
                                                <select
                                                    value={selectedClient}
                                                    onChange={e => setSelectedClient(e.target.value)}
                                                    className="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none"
                                                >
                                                    {clients.map(c => (
                                                        <option key={c.id} value={c.id}>{c.nombre} {c.rnc ? `(${c.rnc})` : ''}</option>
                                                    ))}
                                                </select>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Forma de Pago</label>
                                                    <select
                                                        value={paymentMethod}
                                                        onChange={e => setPaymentMethod(e.target.value)}
                                                        className="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none"
                                                    >
                                                        <option value="Efectivo">Efectivo</option>
                                                        <option value="Tarjeta">Tarjeta</option>
                                                        <option value="Transferencia">Transferencia</option>
                                                        <option value="Credito">A Crédito (CxC)</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">NCF / Comprobante</label>
                                                    <select
                                                        value={ncfType}
                                                        onChange={e => setNcfType(e.target.value)}
                                                        className="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none"
                                                    >
                                                        <option value="B02">B02 Consumidor Final</option>
                                                        <option value="B01">B01 Crédito Fiscal</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="max-h-60 overflow-y-auto space-y-2 pr-1">
                                            {cart.length === 0 ? (
                                                <div class="text-center py-8 text-slate-400 text-sm">
                                                    No hay items agregados a la factura
                                                </div>
                                            ) : (
                                                cart.map((item, idx) => (
                                                    <div key={idx} class="flex justify-between items-center p-2 bg-slate-50 dark:bg-slate-700/50 rounded-lg text-sm">
                                                        <div class="flex-1 pr-2">
                                                            <div class="font-medium text-slate-800 dark:text-slate-200">{item.nombre}</div>
                                                            <div class="text-xs text-slate-400">{negocioConfig.moneda || 'RD$'} {item.precio.toFixed(2)} c/u</div>
                                                        </div>
                                                        <div class="flex items-center space-x-2">
                                                            <button
                                                                onClick={() => {
                                                                    if (item.cantidad > 1) {
                                                                        setCart(cart.map(c => c.id === item.id ? { ...c, cantidad: c.cantidad - 1 } : c));
                                                                    } else {
                                                                        setCart(cart.filter(c => c.id !== item.id));
                                                                    }
                                                                }}
                                                                className="w-6 h-6 rounded bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold flex items-center justify-center"
                                                            >-</button>
                                                            <span class="font-semibold px-1">{item.cantidad}</span>
                                                            <button

                                        theme={theme}
                                        setTheme={setTheme}
                                        itbisRate={itbisRate}
                                        setItbisRate={setItbisRate}
                                    />
                                ) : (
                                    <ConfiguracionDatos />
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL ARMAR PLATO DEL DÍA */}
                    {showPlatoModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-bold">Armar Plato del Día ({menuDate})</h3>
                                    <button onClick={() => setShowPlatoModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>

                                <div class="space-y-3 max-h-[65vh] overflow-y-auto pr-1">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">1. Arroz / Principal Disponibles</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            {menuDiaConfig.arroces.filter(a => a.disponible).length === 0 ? (
                                                <p class="text-xs text-red-500 col-span-2">No hay arroces disponibles hoy.</p>
                                            ) : (
                                                menuDiaConfig.arroces.filter(a => a.disponible).map(item => (
                                                    <button
                                                        key={item.id}
                                                        onClick={() => setPlatoConfig({ ...platoConfig, principal: item.nombre })}
                                                        className={`p-2 text-xs rounded-lg border font-medium text-left ${
                                                            platoConfig.principal === item.nombre
                                                                ? 'border-sky-500 bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 font-bold'
                                                                : 'border-slate-200 dark:border-slate-700'
                                                        }`}
                                                    >
                                                        {item.nombre}
                                                    </button>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">
                                            2. Carnes Disponibles {isLocrio && <span class="text-amber-500 font-normal">(No aplica para Locrio)</span>}
                                        </label>
                                        <div class="grid grid-cols-3 gap-2">
                                            {menuDiaConfig.carnes.filter(c => c.disponible).length === 0 ? (
                                                <p class="text-xs text-red-500 col-span-3">No hay carnes disponibles hoy.</p>
                                            ) : (
                                                menuDiaConfig.carnes.filter(c => c.disponible).map(item => (
                                                    <button
                                                        key={item.id}
                                                        disabled={isLocrio}
                                                        onClick={() => setPlatoConfig({ ...platoConfig, carne: item.nombre })}
                                                        className={`p-2 text-xs rounded-lg border font-medium text-center ${
                                                            isLocrio
                                                                ? 'opacity-45 cursor-not-allowed border-slate-200'
                                                                : platoConfig.carne === item.nombre
                                                                ? 'border-sky-500 bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 font-bold'
                                                                : 'border-slate-200 dark:border-slate-700'
                                                        }`}
                                                    >
                                                        {item.nombre}
                                                    </button>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">3. Ensalada Disponible</label>
                                        <div class="grid grid-cols-3 gap-2">
                                            {menuDiaConfig.ensaladas.filter(e => e.disponible).map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => setPlatoConfig({ ...platoConfig, ensalada: item.nombre })}
                                                    className={`p-2 text-xs rounded-lg border font-medium text-center ${
                                                        platoConfig.ensalada === item.nombre
                                                            ? 'border-sky-500 bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 font-bold'
                                                            : 'border-slate-200 dark:border-slate-700'
                                                    }`}
                                                >
                                                    {item.nombre}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">4. Extra Disponible</label>
                                        <div class="grid grid-cols-3 gap-2">
                                            {menuDiaConfig.extras.filter(x => x.disponible).map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => setPlatoConfig({ ...platoConfig, extra: item.nombre })}
                                                    className={`p-2 text-xs rounded-lg border font-medium text-center capitalize ${
                                                        platoConfig.extra === item.nombre
                                                            ? 'border-sky-500 bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 font-bold'
                                                            : 'border-slate-200 dark:border-slate-700'
                                                    }`}
                                                >
                                                    {item.nombre}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div class="pt-2 border-t">
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">
                                            Precio del Plato (Mínimo {negocioConfig.moneda || 'RD$'} {menuDiaConfig.precioBase})
                                        </label>
                                        <input
                                            type="number"
                                            min={menuDiaConfig.precioBase}
                                            value={platoConfig.precio}
                                            onChange={e => setPlatoConfig({ ...platoConfig, precio: Math.max(menuDiaConfig.precioBase, Number(e.target.value)) })}
                                            className="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg p-2 font-bold text-sky-600"
                                        />
                                    </div>
                                </div>

                                <button
                                    onClick={handleAddPlatoDia}
                                    className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg"
                                >
                                    Agregar Plato al Carrito
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL TICKET RECEIPT / FACTURA */}
                    {showReceipt && lastInvoice && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div class="bg-white text-slate-900 rounded-xl max-w-sm w-full p-6 shadow-2xl relative font-mono text-xs">
                                <div id="printable-receipt" class="space-y-3 border p-4 rounded bg-slate-50">
                                    <div class="text-center">
                                        <h2 class="text-base font-black tracking-widest uppercase">{negocioConfig.nombreNegocio || 'CAFETERÍA ADTECH'}</h2>
                                        <p>RNC: {negocioConfig.rnc || '130999888'}</p>
                                        {negocioConfig.telefono && <p>Tel: {negocioConfig.telefono}</p>}
                                        <p>{negocioConfig.direccion || 'Santo Domingo, R.D.'}</p>
                                        <p class="mt-2 font-bold">{lastInvoice.ncf}</p>
                                        <p class="text-[10px] text-slate-500">{lastInvoice.fecha}</p>
                                    </div>

                                    <div class="border-b border-t border-dashed border-slate-400 py-2 space-y-1">
                                        <p><strong>Cliente:</strong> {lastInvoice.cliente}</p>
                                        {lastInvoice.rnc && <p><strong>RNC/Cédula:</strong> {lastInvoice.rnc}</p>}
                                        <p><strong>Pago:</strong> {lastInvoice.metodoPago}</p>
                                    </div>

                                    <div class="space-y-1">
                                        {lastInvoice.items.map((it, i) => (
                                            <div key={i} class="flex justify-between">
                                                <span>{it.cantidad}x {it.nombre.substring(0, 25)}</span>
                                                <span>{negocioConfig.moneda || 'RD$'} {(it.precio * it.cantidad).toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div class="border-t border-dashed border-slate-400 pt-2 space-y-1 text-right">
                                        <div class="flex justify-between">
                                            <span>Subtotal:</span>
                                            <span>{negocioConfig.moneda || 'RD$'} {lastInvoice.subtotal.toFixed(2)}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span>ITBIS:</span>
                                            <span>{negocioConfig.moneda || 'RD$'} {lastInvoice.itbis.toFixed(2)}</span>
                                        </div>
                                        <div class="flex justify-between text-sm font-black border-t pt-1">
                                            <span>TOTAL:</span>
                                            <span>{negocioConfig.moneda || 'RD$'} {lastInvoice.total.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    <div class="text-center pt-3 border-t text-[10px] text-slate-500">
                                        {negocioConfig.pieFactura || '¡Gracias por su compra en AdTech!'}
                                    </div>
                                </div>

                                <div class="mt-4 flex space-x-2">
                                    <button
                                        onClick={() => window.print()}
                                        className="flex-1 bg-sky-500 text-white font-bold py-2 rounded-lg text-sm flex items-center justify-center space-x-1"
                                    >
                                        <Icon name="printer" size={16} />
                                        <span>Imprimir</span>
                                    </button>
                                    <button
                                        onClick={() => setShowReceipt(false)}
                                        className="flex-1 bg-slate-200 text-slate-800 font-bold py-2 rounded-lg text-sm"
                                    >
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CREAR / VERIFICAR CLIENTE CON FORMULARIO DGII INTEGRADO */}
                    {showClientModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div class="my-8 w-full max-w-2xl">
                                <ClienteFormulario 
                                    onGuardarCliente={handleGuardarNuevoCliente}
                                    onCancelar={() => setShowClientModal(false)}
                                />
                            </div>
                        </div>
                    )}

                    {/* MODAL CREAR PROVEEDOR */}
                    {showSupplierModal && (
                        <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl max-w-md w-full space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <h3 class="font-bold text-lg">Nuevo Proveedor</h3>
                                <div>
                                    <label class="block text-xs font-semibold mb-1">Nombre Proveedor</label>
                                    <input
                                        type="text"
                                        value={newSupplier.nombre}
                                        onChange={e => setNewSupplier({ ...newSupplier, nombre: e.target.value })}
                                        className="w-full p-2 border rounded dark:bg-slate-700"
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1">RNC</label>
                                    <input
                                        type="text"
                                        value={newSupplier.rnc}
                                        onChange={e => setNewSupplier({ ...newSupplier, rnc: e.target.value })}
                                        className="w-full p-2 border rounded dark:bg-slate-700"
                                    />
                                </div>
                                <div class="flex space-x-2">
                                    <button
                                        onClick={() => {
                                            if (!newSupplier.nombre) return alert('Ingrese el nombre');
                                            setSuppliers([...suppliers, { id: Date.now().toString(), nombre: newSupplier.nombre, rnc: newSupplier.rnc, cxp: 0 }]);
                                            setNewSupplier({ nombre: '', rnc: '' });
                                            setShowSupplierModal(false);
                                        }}
                                        className="flex-1 bg-sky-500 text-white font-bold py-2 rounded-lg"
                                    >
                                        Guardar
                                    </button>
                                    <button onClick={() => setShowSupplierModal(false)} className="flex-1 bg-slate-200 dark:bg-slate-700 py-2 rounded-lg">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL NUEVO / EDITAR PRODUCTO */}
                    {showProductModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-lg font-bold">
                                        {editingProductId ? 'Editar Artículo / Producto' : 'Nuevo Producto / Artículo'}
                                    </h3>
                                    <button onClick={() => setShowProductModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>

                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-xs font-semibold mb-1">Nombre del Producto</label>
                                        <input
                                            type="text"
                                            placeholder="Ej. Jugo de Chinola, Pastelito..."
                                            value={productForm.nombre}
                                            onChange={e => setProductForm({ ...productForm, nombre: e.target.value })}
                                            className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm focus:ring-2 focus:ring-sky-500 outline-none"
                                        />
                                    </div>

                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-xs font-semibold mb-1">Precio Costo ({negocioConfig.moneda || 'RD$'})</label>
                                            <input
                                                type="number"
                                                value={productForm.costo}
                                                onChange={e => setProductForm({ ...productForm, costo: Number(e.target.value) })}
                                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold mb-1">Precio Venta ({negocioConfig.moneda || 'RD$'})</label>
                                            <input
                                                type="number"
                                                value={productForm.venta}
                                                onChange={e => setProductForm({ ...productForm, venta: Number(e.target.value) })}
                                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm font-bold text-sky-600"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-semibold mb-1">Categoría</label>
                                        <select
                                            value={productForm.categoria}
                                            onChange={e => setProductForm({ ...productForm, categoria: e.target.value })}
                                            className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                                        >
                                            <option value="Bebidas">Bebidas</option>
                                            <option value="Refrescos">Refrescos</option>
                                            <option value="Platos">Platos</option>
                                            <option value="Postres">Postres</option>
                                            <option value="Snacks">Snacks</option>
                                        </select>
                                    </div>

                                    <div class="space-y-2 border p-3 rounded-xl bg-slate-50 dark:bg-slate-700/30">
                                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Imagen del Artículo</label>
                                        
                                        <div class="flex items-center space-x-3">
                                            <div class="w-14 h-14 bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden border flex-shrink-0">
                                                {productForm.img ? (
                                                    <img src={productForm.img} alt="Vista previa" class="w-full h-full object-cover" />
                                                ) : (
                                                    <div class="w-full h-full flex items-center justify-center text-slate-400 text-[10px]">Sin img</div>
                                                )}
                                            </div>
                                            
                                            <div class="flex-1 space-y-2">
                                                <div>
                                                    <label class="block text-[11px] font-medium text-slate-500 mb-0.5">Subir desde PC:</label>
                                                    <input
                                                        type="file"
                                                        accept="image/*"
                                                        onChange={handleImageFileChange}
                                                        className="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-[11px] font-medium text-slate-500 mb-0.5">O pegar enlace Web (URL):</label>
                                            <input
                                                type="text"
                                                placeholder="https://images.unsplash.com/..."
                                                value={productForm.img.startsWith('data:') ? '' : productForm.img}
                                                onChange={e => setProductForm({ ...productForm, img: e.target.value })}
                                                className="w-full p-2 border rounded-lg dark:bg-slate-700 text-xs"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div class="flex space-x-2 pt-2">
                                    <button
                                        onClick={handleSaveProduct}
                                        className="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow"
                                    >
                                        {editingProductId ? 'Actualizar Artículo' : 'Guardar Producto'}
                                    </button>
                                    <button
                                        onClick={() => setShowProductModal(false)}
                                        className="flex-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 font-bold py-3 rounded-xl transition"
                                    >
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
