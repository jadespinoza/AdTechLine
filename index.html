<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTech POS - Cafetería & Menú del Día</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#38bdf8',
                            DEFAULT: '#0284c7',
                            dark: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <!-- Componentes modulares reutilizables -->
    <script type="text/babel" src="./js/components/ClienteFormulario.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionDatos.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionGeneral.js"></script>
    <script type="text/babel" src="./js/components/ComprasModulo.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Componente de Iconos auxiliares
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        function App() {
            // Estados de Configuración y Tema
            const [theme, setTheme] = useState(localStorage.getItem('adtech_theme') || 'light');
            const [activeTab, setActiveTab] = useState('pos');
            const [configSubTab, setConfigSubTab] = useState('general');
            const [itbisRate, setItbisRate] = useState(18);

            // Datos de Empresa / Negocio
            const [negocioConfig, setNegocioConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_negocio_config');
                return saved ? JSON.parse(saved) : {
                    nombreNegocio: 'Cafetería & Restaurant AdTech',
                    rnc: '130999888',
                    telefono: '(809) 555-0192',
                    direccion: 'Santo Domingo, R.D.',
                    moneda: 'RD$',
                    itbis: 18,
                    tema: 'light',
                    pieFactura: '¡Gracias por su compra en AdTech!'
                };
            });

            // Fecha actual del menú
            const [menuDate, setMenuDate] = useState(new Date().toISOString().split('T')[0]);

            // Menú del Día Config
            const [menuDiaConfig, setMenuDiaConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_menu_dia_config');
                return saved ? JSON.parse(saved) : {
                    arroces: [
                        { id: 'ar1', nombre: 'Arroz blanco', disponible: true },
                        { id: 'ar2', nombre: 'Arroz Moro', disponible: true },
                        { id: 'ar3', nombre: 'Arroz Amarillo', disponible: true },
                        { id: 'ar4', nombre: 'Locrio', disponible: true }
                    ],
                    carnes: [
                        { id: 'c1', nombre: 'Pollo frito', disponible: true },
                        { id: 'c2', nombre: 'Pollo guisado', disponible: true },
                        { id: 'c3', nombre: 'Cerdo', disponible: true },
                        { id: 'c4', nombre: 'Costilla', disponible: true },
                        { id: 'c5', nombre: 'Chuleta', disponible: true },
                        { id: 'c6', nombre: 'Res', disponible: false }
                    ],
                    ensaladas: [
                        { id: 'e1', nombre: 'Verde', disponible: true },
                        { id: 'e2', nombre: 'Rusa', disponible: true },
                        { id: 'e3', nombre: 'Colleslaw', disponible: true }
                    ],
                    extras: [
                        { id: 'x1', nombre: 'Plátano frito', disponible: true },
                        { id: 'x2', nombre: 'Arepa frita', disponible: true },
                        { id: 'x3', nombre: 'Berenjena', disponible: true }
                    ],
                    precioBase: 200
                };
            });

            // Productos e Inventario
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('adtech_products');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Coca-Cola', costo: 25, venta: 35, categoria: 'Refrescos', disponible: true, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' },
                    { id: '2', nombre: 'Plato del Día', costo: 120, venta: 200, categoria: 'Platos', esPlatoDia: true, disponible: true, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300' },
                    { id: '3', nombre: 'Jugo Natural Chinola', costo: 30, venta: 60, categoria: 'Bebidas', disponible: true, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300' },
                    { id: '4', nombre: 'Tres Leches', costo: 50, venta: 100, categoria: 'Postres', disponible: true, img: 'https://images.unsplash.com/photo-1587314168485-3236d6710814?w=300' }
                ];
            });

            // Clientes y Proveedores
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('adtech_clients');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Consumidor Final', rnc: '', cxc: 0 },
                    { id: '2', nombre: 'Empresa ABC SRL', rnc: '101010101', cxc: 450 }
                ];
            });

            const [suppliers, setSuppliers] = useState(() => {
                const saved = localStorage.getItem('adtech_suppliers');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Distribuidora Corripio', rnc: '101888777', cxp: 1200 }
                ];
            });

            // Carrito y Facturación POS
            const [cart, setCart] = useState([]);
            const [selectedClient, setSelectedClient] = useState('1');
            const [paymentMethod, setPaymentMethod] = useState('Efectivo');
            const [ncfType, setNcfType] = useState('B02');
            const [discount, setDiscount] = useState(0);

            // Modales POS
            const [showPlatoModal, setShowPlatoModal] = useState(false);
            const [platoConfig, setPlatoConfig] = useState({ principal: '', carne: '', ensalada: '', extra: '', precio: 200 });
            const [showReceipt, setShowReceipt] = useState(false);
            const [lastInvoice, setLastInvoice] = useState(null);
            const [showClientModal, setShowClientModal] = useState(false);
            const [showSupplierModal, setShowSupplierModal] = useState(false);
            const [newSupplier, setNewSupplier] = useState({ nombre: '', rnc: '' });
            
            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [productForm, setProductForm] = useState({ nombre: '', costo: 0, venta: 0, categoria: 'Bebidas', img: '' });

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('adtech_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('adtech_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('adtech_clients', JSON.stringify(clients));
            }, [clients]);

            useEffect(() => {
                localStorage.setItem('adtech_menu_dia_config', JSON.stringify(menuDiaConfig));
            }, [menuDiaConfig]);

            const isLocrio = platoConfig.principal && platoConfig.principal.toLowerCase().includes('locrio');

            const handleAddPlatoDia = () => {
                if (!platoConfig.principal) return alert('Por favor seleccione el arroz / plato principal.');
                if (!isLocrio && !platoConfig.carne) return alert('Por favor seleccione una carne.');
                
                const desc = `Plato del Día (${menuDate}): ${platoConfig.principal}${isLocrio ? '' : ', Carne: ' + platoConfig.carne}${platoConfig.ensalada ? ', Ensalada: ' + platoConfig.ensalada : ''}${platoConfig.extra ? ', Extra: ' + platoConfig.extra : ''}`;
                const item = {
                    id: 'plato-' + Date.now(),
                    nombre: desc,
                    precio: Math.max(menuDiaConfig.precioBase, Number(platoConfig.precio)),
                    cantidad: 1,
                    esCustom: true
                };
                setCart([...cart, item]);
                setShowPlatoModal(false);
            };

            const addToCart = (product) => {
                if (product.esPlatoDia) {
                    const primerArroz = menuDiaConfig.arroces.find(a => a.disponible)?.nombre || '';
                    const primeraCarne = menuDiaConfig.carnes.find(c => c.disponible)?.nombre || '';
                    const primeraEnsalada = menuDiaConfig.ensaladas.find(e => e.disponible)?.nombre || '';
                    const primerExtra = menuDiaConfig.extras.find(x => x.disponible)?.nombre || '';

                    setPlatoConfig({ principal: primerArroz, carne: primeraCarne, ensalada: primeraEnsalada, extra: primerExtra, precio: menuDiaConfig.precioBase });
                    setShowPlatoModal(true);
                    return;
                }
                const existing = cart.find(c => c.id === product.id);
                if (existing) {
                    setCart(cart.map(c => c.id === product.id ? { ...c, cantidad: c.cantidad + 1 } : c));
                } else {
                    setCart([...cart, { id: product.id, nombre: product.nombre, precio: product.venta, cantidad: 1 }]);
                }
            };

            const handleClearInvoice = () => {
                if (cart.length === 0) return alert('El carrito ya está vacío.');
                if (confirm('¿Está seguro de que desea borrar la factura completa?')) {
                    setCart([]);
                    setDiscount(0);
                    setSelectedClient('1');
                    setPaymentMethod('Efectivo');
                }
            };

            const handleImageFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setProductForm(prev => ({ ...prev, img: reader.result }));
                    reader.readAsDataURL(file);
                }
            };

            const openNewProductModal = () => {
                setEditingProductId(null);
                setProductForm({ nombre: '', costo: 0, venta: 0, categoria: 'Bebidas', img: '' });
                setShowProductModal(true);
            };

            const openEditProductModal = (prod) => {
                setEditingProductId(prod.id);
                setProductForm({ nombre: prod.nombre, costo: prod.costo, venta: prod.venta, categoria: prod.categoria || 'Bebidas', img: prod.img || '' });
                setShowProductModal(true);
            };

            const handleSaveProduct = () => {
                if (!productForm.nombre) return alert('Ingrese el nombre del producto.');
                if (editingProductId) {
                    setProducts(products.map(p => p.id === editingProductId ? { ...p, ...productForm } : p));
                } else {
                    setProducts([...products, { id: Date.now().toString(), ...productForm, disponible: true }]);
                }
                setShowProductModal(false);
            };

            const handleGuardarNuevoCliente = (nuevoClienteObj) => {
                setClients([...clients, nuevoClienteObj]);
                setSelectedClient(nuevoClienteObj.id);
                setShowClientModal(false);
            };

            const subtotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const discountAmount = (subtotal * discount) / 100;
            const subtotalNeto = subtotal - discountAmount;
            const itbis = subtotalNeto * (itbisRate / 100);
            const total = subtotalNeto + itbis;

            const handleFacturar = () => {
                if (cart.length === 0) return alert('El carrito está vacío');
                const clientObj = clients.find(c => c.id === selectedClient) || { nombre: 'Cliente General' };
                
                const invoice = {
                    id: 'FAC-' + Math.floor(100000 + Math.random() * 900000),
                    ncf: ncfType + '00000123',
                    fecha: new Date().toLocaleString(),
                    cliente: clientObj.nombre,
                    rnc: clientObj.rnc,
                    metodoPago: paymentMethod,
                    items: [...cart],
                    subtotal,
                    discountAmount,
                    itbis,
                    total
                };

                if (paymentMethod === 'Credito') {
                    setClients(clients.map(c => c.id === selectedClient ? { ...c, cxc: c.cxc + total } : c));
                }

                setLastInvoice(invoice);
                setShowReceipt(true);
                setCart([]);
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header TopBar */}
                    <header class="bg-sky-500 dark:bg-slate-800 text-white p-4 shadow-lg flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="bg-white text-sky-600 font-black px-3 py-1 rounded-xl text-xl shadow">AdTech</div>
                            <span class="text-xs sm:text-sm font-light text-sky-100 border-l pl-3 border-sky-400">
                                {negocioConfig.nombreNegocio || 'Sistema POS Cafetería'}
                            </span>
                        </div>
                        
                        <div class="flex items-center space-x-3">
                            <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Cambiar Tema">
                                <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                            </button>
                            <button onClick={() => setActiveTab('config')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Configuración">
                                <Icon name="settings" size={20} />
                            </button>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 flex space-x-4 overflow-x-auto">
                        {[
                            { id: 'pos', label: 'Facturación / POS', icon: 'shopping-cart' },
                            { id: 'compras', label: 'Módulo de Compras', icon: 'package' },
                            { id: 'menudia', label: 'Menú del Día', icon: 'utensils' },
                            { id: 'inventory', label: 'Inventario & Productos', icon: 'grid' },
                            { id: 'clients', label: 'Clientes & CxC', icon: 'users' },
                            { id: 'suppliers', label: 'Proveedores & CxP', icon: 'truck' },
                            { id: 'config', label: 'Configuración & Datos', icon: 'settings' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center space-x-2 py-3 px-4 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${
                                    activeTab === tab.id
                                        ? 'border-sky-500 text-sky-600 dark:text-sky-400 font-bold'
                                        : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
                                }`}
                            >
                                <Icon name={tab.icon} size={16} />
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Main Content Layout */}
                    <main class="flex-1 p-4 max-w-7xl w-full mx-auto">
                        {/* TAB 1: POS FACTURACIÓN */}
                        {activeTab === 'pos' && (
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <div class="lg:col-span-7 flex flex-col space-y-4">
                                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                        <h2 class="font-bold text-lg text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                            <Icon name="grid" size={20} /> Productos Disponibles
                                        </h2>
                                        <span class="text-xs bg-sky-100 text-sky-800 dark:bg-sky-900 dark:text-sky-200 font-semibold px-2.5 py-1 rounded-full">
                                            {products.filter(p => p.disponible).length} Items
                                        </span>
                                    </div>

                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        {products.filter(p => p.disponible).map(product => (
                                            <button
                                                key={product.id}
                                                onClick={() => addToCart(product)}
                                                className="group relative bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-md hover:shadow
