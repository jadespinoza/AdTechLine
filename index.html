<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTech POS - Cafetería & Menú del Día</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#38bdf8',
                            DEFAULT: '#0284c7',
                            dark: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <!-- Componentes modulares reutilizables -->
    <script type="text/babel" src="./js/components/ClienteFormulario.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionDatos.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionGeneral.js"></script>
    <script type="text/babel" src="./js/components/ComprasModulo.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Componentes de Iconos auxiliares
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        function App() {
            // Estados de Configuración y Tema
            const [theme, setTheme] = useState(localStorage.getItem('adtech_theme') || 'light');
            const [language, setLanguage] = useState(localStorage.getItem('adtech_lang') || 'es');
            const [activeTab, setActiveTab] = useState('pos');
            const [configSubTab, setConfigSubTab] = useState('general'); // 'general' | 'usuarios' | 'datos'
            const [itbisRate, setItbisRate] = useState(18);

            // Gestión de Usuarios y Autenticación (Soporte, Administrador, Cajero)
            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('adtech_users');
                if (saved) return JSON.parse(saved);
                return [
                    { id: '1', username: 'Adporte', pin: '1234', nombre: 'Soporte Técnico Principal', email: 'soporte@adtech.com', rol: 'soporte' },
                    { id: '2', username: 'admin', pin: 'admin', nombre: 'Administrador General', email: 'admin@adtech.com', rol: 'admin' },
                    { id: '3', username: 'cajero', pin: '1111', nombre: 'Cajero Principal', email: 'cajero@adtech.com', rol: 'cajero' }
                ];
            });
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ username: '', pin: '' });
            const [showLoginConfig, setShowLoginConfig] = useState(false);

            useEffect(() => {
                localStorage.setItem('adtech_users', JSON.stringify(users));
            }, [users]);

            // Datos de Empresa / Negocio
            const [negocioConfig, setNegocioConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_negocio_config');
                return saved ? JSON.parse(saved) : {
                    nombreNegocio: 'Cafetería & Restaurant AdTech',
                    rnc: '130999888',
                    telefono: '(809) 555-0192',
                    direccion: 'Santo Domingo, R.D.',
                    moneda: 'RD$',
                    itbis: 18,
                    tema: 'light',
                    pieFactura: '¡Gracias por su compra en AdTech!'
                };
            });

            // Fecha actual del menú
            const [menuDate, setMenuDate] = useState(new Date().toISOString().split('T')[0]);

            // Menú del Día Dinámico y Modificable
            const [menuDiaConfig, setMenuDiaConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_menu_dia_config');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Si ya tiene submenusDinamicos, retornarlo
                    if (parsed.submenusDinamicos) return parsed;
                }
                // Estructura por defecto con submenús dinámicos totalmente editables
                return {
                    precioBase: 200,
                    submenusDinamicos: {
                        arroces: {
                            titulo: 'Arroz / Principal',
                            elementos: [
                                { id: 'ar1', nombre: 'Arroz blanco', disponible: true },
                                { id: 'ar2', nombre: 'Arroz Moro', disponible: true },
                                { id: 'ar3', nombre: 'Arroz Amarillo', disponible: true },
                                { id: 'ar4', nombre: 'Locrio', disponible: true }
                            ]
                        },
                        carnes: {
                            titulo: 'Carnes',
                            elementos: [
                                { id: 'c1', nombre: 'Pollo frito', disponible: true },
                                { id: 'c2', nombre: 'Pollo guisado', disponible: true },
                                { id: 'c3', nombre: 'Cerdo', disponible: true },
                                { id: 'c4', nombre: 'Costilla', disponible: true },
                                { id: 'c5', nombre: 'Chuleta', disponible: true },
                                { id: 'c6', nombre: 'Res', disponible: true }
                            ]
                        },
                        ensaladas: {
                            titulo: 'Ensaladas',
                            elementos: [
                                { id: 'e1', nombre: 'Verde', disponible: true },
                                { id: 'e2', nombre: 'Rusa', disponible: true }
                            ]
                        }
                    }
                };
            });

            // Productos e Inventario con Stock en tiempo real
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('adtech_products');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Coca-Cola', costo: 25, venta: 35, stock: 24, controlarStock: true, categoria: 'Refrescos', disponible: true, tieneSubmenu: false, precioEditable: false, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' },
                    { 
                        id: '2', 
                        nombre: 'Plato del Día', 
                        costo: 120, 
                        venta: 200, 
                        stock: 50,
                        controlarStock: false,
                        categoria: 'Platos', 
                        esPlatoDia: true, 
                        tieneSubmenu: true, 
                        precioEditable: true,
                        disponible: true, 
                        img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300' 
                    },
                    { id: '3', nombre: 'Jugo Natural Chinola', costo: 30, venta: 60, stock: 15, controlarStock: true, categoria: 'Bebidas', disponible: true, tieneSubmenu: false, precioEditable: false, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300' }
                ];
            });

            // Clientes y Proveedores
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('adtech_clients');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Consumidor Final', rnc: '', cxc: 0 },
                    { id: '2', nombre: 'Empresa ABC SRL', rnc: '101010101', cxc: 450 }
                ];
            });

            const [suppliers, setSuppliers] = useState(() => {
                const saved = localStorage.getItem('adtech_suppliers');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Distribuidora Corripio', rnc: '101888777', cxp: 1200 }
                ];
            });

            // Carrito y Facturación
            const [cart, setCart] = useState([]);
            const [selectedClient, setSelectedClient] = useState('1');
            const [paymentMethod, setPaymentMethod] = useState('Efectivo');
            const [ncfType, setNcfType] = useState('B02');
            const [discount, setDiscount] = useState(0);

            // Modales de Submenú & Productos
            const [showPlatoModal, setShowPlatoModal] = useState(false);
            const [activeSubmenuProduct, setActiveSubmenuProduct] = useState(null);
            const [platoConfig, setPlatoConfig] = useState({});

            const [showReceipt, setShowReceipt] = useState(false);
            const [lastInvoice, setLastInvoice] = useState(null);

            // Modales de Administración
            const [showClientModal, setShowClientModal] = useState(false);
            const [showSupplierModal, setShowSupplierModal] = useState(false);
            
            // Estado para Nuevo / Editar Producto
            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [productForm, setProductForm] = useState({
                nombre: '',
                costo: 0,
                venta: 0,
                stock: 10,
                controlarStock: true,
                categoria: 'Platos',
                img: '',
                tieneSubmenu: false,
                precioEditable: false
            });

            // Persistencia
            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('adtech_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('adtech_lang', language);
            }, [language]);

            useEffect(() => {
                localStorage.setItem('adtech_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('adtech_clients', JSON.stringify(clients));
            }, [clients]);

            useEffect(() => {
                localStorage.setItem('adtech_menu_dia_config', JSON.stringify(menuDiaConfig));
            }, [menuDiaConfig]);

            const handleInventarioActualizado = (nuevoInventario) => {
                setProducts(nuevoInventario);
            };

            // Manejo de Login
            const handleLogin = (e) => {
                e.preventDefault();
                const found = users.find(u => u.username.toLowerCase() === loginForm.username.toLowerCase() && u.pin === loginForm.pin);
                if (found) {
                    setCurrentUser(found);
                } else {
                    alert('Usuario o contraseña incorrectos.');
                }
            };

            const handleOlvidePassword = () => {
                if (confirm('¿Desea restablecer las credenciales? Esto restaurará el usuario de Soporte por defecto (Adporte / 1234).')) {
                    const defaultUser = [{ id: '1', username: 'Adporte', pin: '1234', nombre: 'Soporte Técnico Principal', email: 'soporte@adtech.com', rol: 'soporte' }];
                    setUsers(defaultUser);
                    localStorage.setItem('adtech_users', JSON.stringify(defaultUser));
                    alert('Credenciales restablecidas. Usuario: Adporte | Clave: 1234');
                }
            };

            // Lógica Submenú Dinámico para Plato del Día
            const handleAddPlatoDia = () => {
                if (!activeSubmenuProduct) return;
                
                let detalles = [];
                Object.entries(platoConfig).forEach(([key, val]) => {
                    if (val) detalles.push(val);
                });

                if (detalles.length === 0) {
                    return alert('Por favor seleccione al menos una opción para el plato.');
                }

                const desc = `${activeSubmenuProduct.nombre} (${menuDate}): ${detalles.join(', ')}`;
                
                const item = {
                    id: 'custom-' + Date.now(),
                    productId: activeSubmenuProduct.id,
                    nombre: desc,
                    precio: Number(platoConfig.precio) || (activeSubmenuProduct.esPlatoDia ? menuDiaConfig.precioBase : activeSubmenuProduct.venta),
                    cantidad: 1,
                    esCustom: true,
                    controlarStock: activeSubmenuProduct.controlarStock
                };
                setCart([...cart, item]);
                setShowPlatoModal(false);
            };

            const addToCart = (product) => {
                const usaSubmenu = product.tieneSubmenu || product.esPlatoDia;

                if (usaSubmenu) {
                    setActiveSubmenuProduct(product);
                    const initialConfig = { precio: product.esPlatoDia ? menuDiaConfig.precioBase : product.venta };
                    if (menuDiaConfig.submenusDinamicos) {
                        Object.keys(menuDiaConfig.submenusDinamicos).forEach(k => {
                            initialConfig[k] = '';
                        });
                    }
                    setPlatoConfig(initialConfig);
                    setShowPlatoModal(true);
                    return;
                }

                if (product.controlarStock && (product.stock || 0) <= 0) {
                    return alert(`El producto "${product.nombre}" está agotado en inventario.`);
                }

                if (product.precioEditable) {
                    const customPrice = prompt(`Ingrese el precio de venta para "${product.nombre}" (${negocioConfig.moneda || 'RD$'}):`, product.venta);
                    if (customPrice === null) return;
                    const finalPrice = Number(customPrice) || product.venta;
                    setCart([...cart, { id: product.id + '-' + Date.now(), productId: product.id, nombre: product.nombre, precio: finalPrice, cantidad: 1, controlarStock: product.controlarStock }]);
                    return;
                }

                const existing = cart.find(c => c.id === product.id);
                if (existing) {
                    if (product.controlarStock && existing.cantidad >= product.stock) {
                        return alert(`Stock insuficiente. Solo quedan ${product.stock} unidades disponibles.`);
                    }
                    setCart(cart.map(c => c.id === product.id ? { ...c, cantidad: c.cantidad + 1 } : c));
                } else {
                    setCart([...cart, { id: product.id, productId: product.id, nombre: product.nombre, precio: product.venta, cantidad: 1, controlarStock: product.controlarStock }]);
                }
            };

            const handleClearInvoice = () => {
                if (cart.length === 0) return alert('El carrito ya está vacío.');
                if (confirm('¿Está seguro de que desea borrar la factura completa?')) {
                    setCart([]);
                    setDiscount(0);
                    setSelectedClient('1');
                    setPaymentMethod('Efectivo');
                }
            };

            const openNewProductModal = () => {
                setEditingProductId(null);
                setProductForm({
                    nombre: '',
                    costo: 0,
                    venta: 0,
                    stock: 10,
                    controlarStock: true,
                    categoria: 'Platos',
                    img: '',
                    tieneSubmenu: false,
                    precioEditable: false
                });
                setShowProductModal(true);
            };

            const openEditProductModal = (prod) => {
                setEditingProductId(prod.id);
                setProductForm({
                    nombre: prod.nombre,
                    costo: prod.costo,
                    venta: prod.venta,
                    stock: prod.stock !== undefined ? prod.stock : 10,
                    controlarStock: prod.controlarStock !== false,
                    categoria: prod.categoria || 'Bebidas',
                    img: prod.img || '',
                    tieneSubmenu: prod.tieneSubmenu || prod.esPlatoDia || false,
                    precioEditable: prod.precioEditable || prod.esPlatoDia || false
                });
                setShowProductModal(true);
            };

            const handleSaveProduct = () => {
                if (!productForm.nombre) return alert('Ingrese el nombre del producto.');
                if (editingProductId) {
                    setProducts(products.map(p => p.id === editingProductId ? { ...p, ...productForm } : p));
                } else {
                    const newProd = {
                        id: Date.now().toString(),
                        ...productForm,
                        disponible: true
                    };
                    setProducts([...products, newProd]);
                }
                setShowProductModal(false);
            };

            const handleGuardarNuevoCliente = (nuevoClienteObj) => {
                setClients([...clients, nuevoClienteObj]);
                setSelectedClient(nuevoClienteObj.id);
                setShowClientModal(false);
            };

            // Cálculos
            const grossTotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const discountAmount = (grossTotal * discount) / 100;
            const netTotal = grossTotal - discountAmount;
            const total = netTotal;
            const subtotal = total / (1 + (itbisRate / 100));
            const itbis = total - subtotal;

            const handleFacturar = () => {
                if (cart.length === 0) return alert('El carrito está vacío');
                
                let inventoryUpdated = [...products];
                for (let item of cart) {
                    if (item.productId) {
                        const prod = inventoryUpdated.find(p => p.id === item.productId);
                        if (prod && prod.controlarStock) {
                            if ((prod.stock || 0) < item.cantidad) {
                                return alert(`Stock insuficiente para "${prod.nombre}". Stock actual: ${prod.stock}, requerido: ${item.cantidad}`);
                            }
                            prod.stock -= item.cantidad;
                        }
                    }
                }

                setProducts(inventoryUpdated);
                localStorage.setItem('adtech_products', JSON.stringify(inventoryUpdated));

                const clientObj = clients.find(c => c.id === selectedClient) || { nombre: 'Cliente General' };
                const invoice = {
                    id: 'FAC-' + Math.floor(100000 + Math.random() * 900000),
                    ncf: ncfType + '00000123',
                    fecha: new Date().toLocaleString(),
                    cliente: clientObj.nombre,
                    rnc: clientObj.rnc,
                    metodoPago: paymentMethod,
                    items: [...cart],
                    subtotal,
                    discountAmount,
                    itbis,
                    total
                };

                if (paymentMethod === 'Credito') {
                    setClients(clients.map(c => c.id === selectedClient ? { ...c, cxc: c.cxc + total } : c));
                }

                setLastInvoice(invoice);
                setShowReceipt(true);
                setCart([]);
            };

            // LOGIN
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
                            <div className="text-center space-y-2">
                                <div className="inline-block bg-sky-500 text-white font-black px-4 py-1.5 rounded-xl text-2xl shadow">AdTech</div>
                                <h1 className="text-xl font-bold text-white">Iniciar Sesión</h1>
                                <p className="text-xs text-slate-400">Ingrese sus credenciales de acceso al sistema</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Usuario</label>
                                    <input
                                        type="text"
                                        placeholder="Ej. Adporte, admin, cajero..."
                                        value={loginForm.username}
                                        onChange={e => setLoginForm({ ...loginForm, username: e.target.value })}
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Contraseña / PIN</label>
                                    <input
                                        type="password"
                                        placeholder="••••"
                                        value={loginForm.pin}
                                        onChange={e => setLoginForm({ ...loginForm, pin: e.target.value })}
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500"
                                        required
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg"
                                >
                                    Entrar al Sistema
                                </button>
                            </form>

                            <div className="flex justify-between items-center text-xs pt-2 border-t border-slate-700">
                                <button
                                    type="button"
                                    onClick={() => setShowLoginConfig(true)}
                                    className="text-sky-400 hover:underline flex items-center gap-1"
                                >
                                    <Icon name="settings" size={14} /> Configuración Rápida
                                </button>
                                <button
                                    type="button"
                                    onClick={handleOlvidePassword}
                                    className="text-amber-400 hover:underline"
                                >
                                    ¿Olvidé contraseña?
                                </button>
                            </div>

                            <div className="text-[11px] text-center text-slate-500 bg-slate-900/50 p-2.5 rounded-lg border border-slate-800 space-y-1">
                                <div>Soporte: <strong className="text-slate-300">Adporte</strong> / <strong className="text-slate-300">1234</strong></div>
                                <div>Admin: <strong className="text-slate-300">admin</strong> / <strong className="text-slate-300">admin</strong> | Cajero: <strong className="text-slate-300">cajero</strong> / <strong className="text-slate-300">1111</strong></div>
                            </div>
                        </div>

                        {showLoginConfig && (
                            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
                                    <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                        <h3 className="font-bold text-white text-sm">Configuración Resumida</h3>
                                        <button onClick={() => setShowLoginConfig(false)} className="text-slate-400 hover:text-white">
                                            <Icon name="x" size={18} />
                                        </button>
                                    </div>
                                    <div className="space-y-3 text-xs">
                                        <div>
                                            <label className="block font-semibold text-slate-300 mb-1">Apariencia / Tema</label>
                                            <select
                                                value={theme}
                                                onChange={e => setTheme(e.target.value)}
                                                className="w-full p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white"
                                            >
                                                <option value="light">Modo Claro (Light)</option>
                                                <option value="dark">Modo Oscuro (Dark)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setShowLoginConfig(false)}
                                        className="w-full bg-sky-500 text-white font-bold py-2 rounded-xl text-xs"
                                    >
                                        Guardar y Cerrar
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header TopBar */}
                    <header className="bg-sky-500 dark:bg-slate-800 text-white p-4 shadow-lg flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-white text-sky-600 font-black px-3 py-1 rounded-xl text-xl shadow">AdTech</div>
                            <span className="text-xs sm:text-sm font-light text-sky-100 border-l pl-3 border-sky-400">
                                {negocioConfig.nombreNegocio || 'Sistema POS Cafetería'}
                            </span>
                        </div>
                        
                        <div className="flex items-center space-x-3">
                            <div className="text-xs bg-sky-600 dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-sky-400/30 flex items-center gap-2">
                                <Icon name="user" size={14} />
                                <span className="font-bold">{currentUser.nombre}</span>
                                <span className="bg-sky-700 dark:bg-slate-600 px-1.5 py-0.5 rounded text-[10px] uppercase font-mono">{currentUser.rol}</span>
                            </div>
                            <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Cambiar Tema">
                                <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                            </button>
                            <button onClick={() => setActiveTab('config')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Configuración">
                                <Icon name="settings" size={20} />
                            </button>
                            <button onClick={() => setCurrentUser(null)} className="p-2 rounded-lg bg-red-600 hover:bg-red-700 transition" title="Cerrar Sesión">
                                <Icon name="log-out" size={20} />
                            </button>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 flex space-x-4 overflow-x-auto">
                        {[
                            { id: 'pos', label: 'Facturación / POS', icon: 'shopping-cart' },
                            { id: 'menudia', label: 'Menú del Día (Dinámico)', icon: 'utensils' },
                            { id: 'inventory', label: 'Inventario & Productos', icon: 'grid' },
                            { id: 'clients', label: 'Clientes & CxC', icon: 'users' },

                                    <button onClick={() => setShowPlatoModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>

                                <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                                    {menuDiaConfig.submenusDinamicos && Object.entries(menuDiaConfig.submenusDinamicos).map(([key, submenu]) => (
                                        <div key={key} className="space-y-1">
                                            <label className="block text-xs font-bold text-slate-500 uppercase">{submenu.titulo}</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {submenu.elementos.filter(e => e.disponible !== false).map(item => (
                                                    <button
                                                        key={item.id}
                                                        type="button"
                                                        onClick={() => setPlatoConfig({ ...platoConfig, [key]: platoConfig[key] === item.nombre ? '' : item.nombre })}
                                                        className={`p-2.5 text-xs rounded-lg border font-medium text-left transition ${
                                                            platoConfig[key] === item.nombre 
                                                                ? 'border-sky-500 bg-sky-50 text-sky-600 font-bold dark:bg-sky-900/40 dark:text-sky-300' 
                                                                : 'border-slate-200 dark:border-slate-700'
                                                        }`}
                                                    >
                                                        {item.nombre}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button
                                    onClick={handleAddPlatoDia}
                                    className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg"
                                >
                                    Agregar al Carrito
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL TICKET RECEIPT */}
                    {showReceipt && lastInvoice && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white text-slate-900 rounded-xl max-w-sm w-full p-6 shadow-2xl relative font-mono text-xs">
                                <div id="printable-receipt" className="space-y-3 border p-4 rounded bg-slate-50">
                                    <div className="text-center">
                                        <h2 className="text-base font-black tracking-widest uppercase">{negocioConfig.nombreNegocio || 'CAFETERÍA ADTECH'}</h2>
                                        <p>RNC: {negocioConfig.rnc || '130999888'}</p>
                                        <p className="mt-2 font-bold">{lastInvoice.ncf}</p>
                                        <p className="text-[10px] text-slate-500">{lastInvoice.fecha}</p>
                                    </div>
                                    <div className="border-b border-t border-dashed border-slate-400 py-2 space-y-1">
                                        <p><strong>Cliente:</strong> {lastInvoice.cliente}</p>
                                        <p><strong>Pago:</strong> {lastInvoice.metodoPago}</p>
                                    </div>
                                    <div className="space-y-1">
                                        {lastInvoice.items.map((it, i) => (
                                            <div key={i} className="flex justify-between">
                                                <span>{it.cantidad}x {it.nombre}</span>
                                                <span>{negocioConfig.moneda || 'RD$'} {(it.precio * it.cantidad).toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="border-t border-dashed border-slate-400 pt-2 space-y-1 text-right">
                                        <div className="flex justify-between text-sm font-black">
                                            <span>TOTAL:</span>
                                            <span>{negocioConfig.moneda || 'RD$'} {lastInvoice.total.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-4 flex space-x-2">
                                    <button onClick={() => window.print()} className="flex-1 bg-sky-500 text-white font-bold py-2 rounded-lg text-sm">Imprimir</button>
                                    <button onClick={() => setShowReceipt(false)} className="flex-1 bg-slate-200 text-slate-800 font-bold py-2 rounded-lg text-sm">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CLIENTE */}
                    {showClientModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="my-8 w-full max-w-2xl">
                                <ClienteFormulario onGuardarCliente={handleGuardarNuevoCliente} onCancelar={() => setShowClientModal(false)} />
                            </div>
                        </div>
                    )}

                    {/* MODAL NUEVO / EDITAR PRODUCTO */}
                    {showProductModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl max-w-lg w-full space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <h3 className="text-lg font-bold">{editingProductId ? 'Editar Artículo' : 'Nuevo Producto'}</h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Nombre</label>
                                        <input
                                            type="text"
                                            value={productForm.nombre}
                                            onChange={e => setProductForm({ ...productForm, nombre: e.target.value })}
                                            className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                                        />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Costo</label>
                                            <input
                                                type="number"
                                                value={productForm.costo}
                                                onChange={e => setProductForm({ ...productForm, costo: Number(e.target.value) })}
                                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Venta</label>
                                            <input
                                                type="number"
                                                value={productForm.venta}
                                                onChange={e => setProductForm({ ...productForm, venta: Number(e.target.value) })}
                                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Stock Inicial</label>
                                            <input
                                                type="number"
                                                value={productForm.stock}
                                                onChange={e => setProductForm({ ...productForm, stock: Number(e.target.value) })}
                                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm font-bold text-emerald-600"
                                            />
                                        </div>
                                    </div>
                                    <label className="flex items-center space-x-2 text-xs font-semibold">
                                        <input
                                            type="checkbox"
                                            checked={productForm.controlarStock}
                                            onChange={e => setProductForm({ ...productForm, controlarStock: e.target.checked })}
                                            className="w-4 h-4 text-sky-600 rounded"
                                        />
                                        <span>Controlar Existencia (Stock) en Compras y POS</span>
                                    </label>
                                </div>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={handleSaveProduct} className="flex-1 bg-sky-500 text-white font-bold py-2.5 rounded-xl">Guardar</button>
                                    <button onClick={() => setShowProductModal(false)} className="flex-1 bg-slate-200 dark:bg-slate-700 font-bold py-2.5 rounded-xl">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Componente: Menú del Día Dinámico y Modificable
        function MenuDiaConfigModulo({ menuDiaConfig, setMenuDiaConfig }) {
            const [nuevoSubmenuNombre, setNuevoSubmenuNombre] = useState('');
            const [nuevoElementoTextos, setNuevoElementoTextos] = useState({});

            const guardarCambios = (updatedConfig) => {
                setMenuDiaConfig(updatedConfig);
                localStorage.setItem('adtech_menu_dia_config', JSON.stringify(updatedConfig));
            };

            const handleAgregarSubmenu = (e) => {
                e.preventDefault();
                if (!nuevoSubmenuNombre) return alert('Ingrese el nombre del nuevo submenú.');
                const key = nuevoSubmenuNombre.toLowerCase().replace(/\s+/g, '_');
                
                if (menuDiaConfig.submenusDinamicos && menuDiaConfig.submenusDinamicos[key]) {
                    return alert('Ya existe un submenú con ese nombre.');
                }

                const actualizado = {
                    ...menuDiaConfig,
                    submenusDinamicos: {
                        ...(menuDiaConfig.submenusDinamicos || {}),
                        [key]: {
                            titulo: nuevoSubmenuNombre,
                            elementos: []
                        }
                    }
                };

                guardarCambios(actualizado);
                setNuevoSubmenuNombre('');
            };

            const handleAgregarElemento = (key) => {
                const texto = nuevoElementoTextos[key];
                if (!texto) return alert('Escriba el nombre del elemento a agregar.');

                const submenusActuales = menuDiaConfig.submenusDinamicos || {};
                const targetSubmenu = submenusActuales[key];
                
                const nuevoElemento = {
                    id: 'elem-' + Date.now(),
                    nombre: texto,
                    disponible: true
                };

                targetSubmenu.elementos.push(nuevoElemento);

                guardarCambios({
                    ...menuDiaConfig,
                    submenusDinamicos: submenusActuales
                });

                setNuevoElementoTextos({ ...nuevoElementoTextos, [key]: '' });
            };

            const handleEliminarElemento = (key, elemId) => {
                const submenusActuales = menuDiaConfig.submenusDinamicos || {};
                submenusActuales[key].elementos = submenusActuales[key].elementos.filter(e => e.id !== elemId);
                guardarCambios({ ...menuDiaConfig, submenusDinamicos: submenusActuales });
            };

            const handleEliminarSubmenu = (key) => {
                if (confirm('¿Está seguro de eliminar todo este submenú?')) {
                    const submenusActuales = menuDiaConfig.submenusDinamicos || {};
                    delete submenusActuales[key];
                    guardarCambios({ ...menuDiaConfig, submenusDinamicos: submenusActuales });
                }
            };

            return (
                <div className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md border border-slate-200 dark:border-slate-700 space-y-6 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white">🍽️ Configuración Dinámica del Menú del Día</h2>
                            <p className="text-xs text-slate-500">Crea nuevos submenús, modifica títulos y administra elementos personalizados.</p>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 mb-1">Precio Base Plato del Día:</label>
                            <input
                                type="number"
                                value={menuDiaConfig.precioBase || 200}
                                onChange={e => guardarCambios({ ...menuDiaConfig, precioBase: Number(e.target.value) })}
                                className="w-32 p-2 bg-slate-50 dark:bg-slate-700 border rounded font-bold text-sky-600 text-sm"
                            />
                        </div>
                    </div>

                    <form onSubmit={handleAgregarSubmenu} className="bg-slate-50 dark:bg-slate-700/40 p-4 rounded-xl border flex flex-col sm:flex-row gap-3 items-end">
                        <div className="flex-1 w-full">
                            <label className="block text-xs font-semibold mb-1">Nombre del Nuevo Submenú (Ej. Postres, Sopas, Jugos)</label>
                            <input
                                type="text"
                                placeholder="Nombre de la categoría..."
                                value={nuevoSubmenuNombre}
                                onChange={e => setNuevoSubmenuNombre(e.target.value)}
                                className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm"
                            />
                        </div>
                        <button
                            type="submit"
                            className="bg-sky-500 hover:bg-sky-600 text-white font-bold px-4 py-2.5 rounded-lg text-sm transition whitespace-nowrap shadow"
                        >
                            + Crear Submenú
                        </button>
                    </form>

                    <div className="space-y-6">
                        {menuDiaConfig.submenusDinamicos && Object.keys(menuDiaConfig.submenusDinamicos).length > 0 ? (
                            Object.entries(menuDiaConfig.submenusDinamicos).map(([key, submenu]) => (
                                <div key={key} className="bg-slate-50 dark:bg-slate-700/30 p-5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <input
                                            type="text"
                                            value={submenu.titulo}
                                            onChange={e => {
                                                const submenusActuales = menuDiaConfig.submenusDinamicos;
                                                submenusActuales[key].titulo = e.target.value;
                                                guardarCambios({ ...menuDiaConfig, submenusDinamicos: submenusActuales });
                                            }}
                                            className="font-bold text-base bg-transparent border-b border-dashed border-sky-400 focus:outline-none text-sky-600 dark:text-sky-400"
                                        />
                                        <button
                                            onClick={() => handleEliminarSubmenu(key)}
                                            className="text-rose-500 hover:text-rose-700 text-xs font-bold bg-rose-50 dark:bg-slate-700 px-2.5 py-1 rounded"
                                        >
                                            Eliminar Submenú
                                        </button>
                                    </div>

                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder={`Agregar opción en ${submenu.titulo}...`}
                                            value={nuevoElementoTextos[key] || ''}
                                            onChange={e => setNuevoElementoTextos({ ...nuevoElementoTextos, [key]: e.target.value })}
                                            className="flex-1 p-2 bg-white dark:bg-slate-800 border rounded-lg text-sm"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => handleAgregarElemento(key)}
                                            className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm shadow"
                                        >
                                            + Agregar
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 pt-2">
                                        {submenu.elementos && submenu.elementos.map(elem => (
                                            <div key={elem.id} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2.5 rounded-lg border shadow-sm">
                                                <span className="text-sm font-medium">{elem.nombre}</span>
                                                <button
                                                    onClick={() => handleEliminarElemento(key, elem.id)}
                                                    className="text-rose-500 hover:text-rose-700 font-bold text-xs"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-8 text-slate-400 text-sm">
                                No hay submenús dinámicos creados. Utiliza el formulario superior para agregar categorías.
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Componente auxiliar integrado para Gestión de Usuarios
        function GestionUsuarios({ users, setUsers }) {
            const [showModal, setShowModal] = useState(false);
            const [editing, setEditing] = useState(null);
            const [form, setForm] = useState({ username: '', pin: '', nombre: '', email: '', rol: 'cajero' });

            const handleSave = (e) => {
                e.preventDefault();
                if (!form.username || !form.pin || !form.nombre) return alert('Complete los campos obligatorios.');
                if (editing) {
                    setUsers(users.map(u => u.id === editing.id ? { ...u, ...form } : u));
                } else {
                    setUsers([...users, { id: Date.now().toString(), ...form }]);
                }
                setShowModal(false);
                setEditing(null);
                setForm({ username: '', pin: '', nombre: '', email: '', rol: 'cajero' });
            };

            return (
                <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 space-y-6 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center">
                        <div>
                            <h3 className="text-lg font-bold">Gestión de Usuarios y Permisos</h3>
                            <p className="text-xs text-slate-500">Administra cajeros, administradores y soporte técnico.</p>
                        </div>
                        <button
                            onClick={() => { setEditing(null); setForm({ username: '', pin: '', nombre: '', email: '', rol: 'cajero' }); setShowModal(true); }}
                            className="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold text-sm shadow"
                        >
                            + Nuevo Usuario
                        </button>
                    </div>

                    <div className="overflow-x-auto border rounded-lg border-slate-200 dark:border-slate-700">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-slate-100 dark:bg-slate-700/50">
                                <tr>
                                    <th className="p-3">Nombre</th>
                                    <th className="p-3">Usuario</th>
                                    <th className="p-3">Rol</th>
                                    <th className="p-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 dark:divide-slate-700">
                                {users.map(u => (
                                    <tr key={u.id}>
                                        <td className="p-3 font-medium">{u.nombre}</td>
                                        <td className="p-3 font-mono text-slate-600 dark:text-slate-300">{u.username}</td>
                                        <td className="p-3"><span className="px-2 py-0.5 rounded text-xs font-bold uppercase bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300">{u.rol}</span></td>
                                        <td className="p-3 text-center space-x-2">
                                            <button onClick={() => { setEditing(u); setForm({ username: u.username, pin: u.pin, nombre: u.nombre, email: u.email || '', rol: u.rol || 'cajero' }); setShowModal(true); }} className="text-sky-600 text-xs bg-sky-50 dark:bg-slate-700 px-2.5 py-1 rounded font-medium">Editar</button>
                                            {users.length > 1 && (
                                                <button onClick={() => { if (confirm(`¿Eliminar a ${u.username}?`)) setUsers(users.filter(x => x.id !== u.id)); }} className="text-rose-500 text-xs bg-rose-50 dark:bg-slate-700 px-2.5 py-1 rounded font-medium">Eliminar</button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl border">
                                <h3 className="text-lg font-bold">{editing ? 'Editar Usuario' : 'Nuevo Usuario'}</h3>
                                <form onSubmit={handleSave} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Nombre Completo</label>
                                        <input type="text" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} required className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Usuario (Login)</label>
                                        <input type="text" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })} required className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Contraseña / PIN</label>
                                        <input type="password" value={form.pin} onChange={e => setForm({ ...form, pin: e.target.value })} required className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Rol</label>
                                        <select value={form.rol} onChange={e => setForm({ ...form, rol: e.target.value })} className="w-full p-2.5 border rounded-lg dark:bg-slate-700 text-sm">
                                            <option value="cajero">Cajero (Solo POS)</option>
                                            <option value="admin">Administrador (Inventario y Compras)</option>
                                            <option value="soporte">Soporte Técnico (Acceso Total)</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setShowModal(false)} className="bg-slate-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Cancelar</button>
                                        <button type="submit" className="bg-sky-500 text-white px-5 py-2 rounded-lg text-sm font-bold">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
