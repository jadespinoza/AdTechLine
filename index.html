<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTech POS - Cafetería & Menú del Día</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#38bdf8',
                            DEFAULT: '#0284c7',
                            dark: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <!-- Componentes modulares independientes (cada menú en su propio archivo) -->
    <script type="text/babel" src="./js/components/ClienteFormulario.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionDatos.js"></script>
    <script type="text/babel" src="./js/components/ConfiguracionGeneral.js"></script>
    <script type="text/babel" src="./js/components/ComprasModulo.js"></script>
    <script type="text/babel" src="./js/components/PosModulo.js"></script>
    <script type="text/babel" src="./js/components/MenuDiaModulo.js"></script>
    <script type="text/babel" src="./js/components/InventarioModulo.js"></script>
    <script type="text/babel" src="./js/components/ClientesModulo.js"></script>
    <script type="text/babel" src="./js/components/ProveedoresModulo.js"></script>
    <script type="text/babel" src="./js/components/UsuariosModulo.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        function App() {
            const [theme, setTheme] = useState(localStorage.getItem('adtech_theme') || 'light');
            const [activeTab, setActiveTab] = useState('pos');
            const [configSubTab, setConfigSubTab] = useState('general');
            const [itbisRate, setItbisRate] = useState(18);

            // Usuarios & Login (Primer usuario = Soporte)
            const [users, setUsers] = useState(() => {
                try {
                    const parsed = JSON.parse(localStorage.getItem('adtech_users'));
                    return Array.isArray(parsed) ? parsed : [];
                } catch { return []; }
            });
            const [firstSetupForm, setFirstSetupForm] = useState({ nombre: '', username: '', pin: '', confirmPin: '', email: '' });
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ username: '', pin: '' });
            const [showLoginConfig, setShowLoginConfig] = useState(false);

            // Estados Globales Compartidos entre Módulos
            const [negocioConfig, setNegocioConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_negocio_config');
                return saved ? JSON.parse(saved) : {
                    nombreNegocio: 'Cafetería & Restaurant AdTech',
                    rnc: '130999888',
                    telefono: '(809) 555-0192',
                    direccion: 'Santo Domingo, R.D.',
                    moneda: 'RD$',
                    itbis: 18,
                    tema: 'light',
                    pieFactura: '¡Gracias por su compra en AdTech!'
                };
            });

            const [menuDiaConfig, setMenuDiaConfig] = useState(() => {
                const saved = localStorage.getItem('adtech_menu_dia_config');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.submenusDinamicos) return parsed;
                }
                return {
                    precioBase: 200,
                    submenusDinamicos: {
                        arroces: {
                            titulo: 'Arroz / Principal',
                            elementos: [
                                { id: 'ar1', nombre: 'Arroz blanco', disponible: true },
                                { id: 'ar2', nombre: 'Arroz Moro', disponible: true },
                                { id: 'ar3', nombre: 'Arroz Amarillo', disponible: true },
                                { id: 'ar4', nombre: 'Locrio', disponible: true }
                            ]
                        },
                        carnes: {
                            titulo: 'Carnes',
                            elementos: [
                                { id: 'c1', nombre: 'Pollo frito', disponible: true },
                                { id: 'c2', nombre: 'Pollo guisado', disponible: true },
                                { id: 'c3', nombre: 'Cerdo', disponible: true },
                                { id: 'c4', nombre: 'Costilla', disponible: true },
                                { id: 'c5', nombre: 'Chuleta', disponible: true },
                                { id: 'c6', nombre: 'Res', disponible: true }
                            ]
                        },
                        ensaladas: {
                            titulo: 'Ensaladas',
                            elementos: [
                                { id: 'e1', nombre: 'Verde', disponible: true },
                                { id: 'e2', nombre: 'Rusa', disponible: true }
                            ]
                        }
                    }
                };
            });

            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('adtech_products');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Coca-Cola', costo: 25, venta: 35, stock: 24, controlarStock: true, categoria: 'Refrescos', disponible: true, tieneSubmenu: false, precioEditable: false, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' },
                    { id: '2', nombre: 'Plato del Día', costo: 120, venta: 200, stock: 50, controlarStock: false, categoria: 'Platos', esPlatoDia: true, tieneSubmenu: true, precioEditable: true, disponible: true, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300' },
                    { id: '3', nombre: 'Jugo Natural Chinola', costo: 30, venta: 60, stock: 15, controlarStock: true, categoria: 'Bebidas', disponible: true, tieneSubmenu: false, precioEditable: false, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300' }
                ];
            });

            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('adtech_clients');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Consumidor Final', rnc: '', cxc: 0 },
                    { id: '2', nombre: 'Empresa ABC SRL', rnc: '101010101', cxc: 450 }
                ];
            });

            const [suppliers, setSuppliers] = useState(() => {
                const saved = localStorage.getItem('adtech_suppliers');
                return saved ? JSON.parse(saved) : [
                    { id: '1', nombre: 'Distribuidora Corripio', rnc: '101888777', cxp: 1200 }
                ];
            });

            // Estados de Facturación (POS)
            const [cart, setCart] = useState([]);
            const [selectedClient, setSelectedClient] = useState('1');
            const [paymentMethod, setPaymentMethod] = useState('Efectivo');
            const [ncfType, setNcfType] = useState('B02');
            const [discount, setDiscount] = useState(0);
            const [menuDate] = useState(new Date().toISOString().split('T')[0]);

            // Modales globales
            const [showPlatoModal, setShowPlatoModal] = useState(false);
            const [activeSubmenuProduct, setActiveSubmenuProduct] = useState(null);
            const [platoConfig, setPlatoConfig] = useState({});
            const [showReceipt, setShowReceipt] = useState(false);
            const [lastInvoice, setLastInvoice] = useState(null);
            const [showClientModal, setShowClientModal] = useState(false);

            // Sincronización con localStorage
            useEffect(() => { localStorage.setItem('adtech_users', JSON.stringify(users)); }, [users]);
            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('adtech_theme', theme);
            }, [theme]);
            useEffect(() => { localStorage.setItem('adtech_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('adtech_clients', JSON.stringify(clients)); }, [clients]);
            useEffect(() => { localStorage.setItem('adtech_suppliers', JSON.stringify(suppliers)); }, [suppliers]);
            useEffect(() => { localStorage.setItem('adtech_menu_dia_config', JSON.stringify(menuDiaConfig)); }, [menuDiaConfig]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab, configSubTab, currentUser, showPlatoModal, showReceipt, showClientModal]);

            // Handlers de Login / Registro Soporte
            const handleLogin = (e) => {
                e.preventDefault();
                const found = users.find(u => u.username.toLowerCase() === loginForm.username.toLowerCase() && u.pin === loginForm.pin);
                if (found) setCurrentUser(found);
                else alert('Usuario o contraseña incorrectos.');
            };

            const handleInitialSoporteRegister = (e) => {
                e.preventDefault();
                if (!firstSetupForm.nombre.trim() || !firstSetupForm.username.trim() || !firstSetupForm.pin.trim()) {
                    return alert('Complete todos los campos obligatorios.');
                }
                if (firstSetupForm.pin !== firstSetupForm.confirmPin) {
                    return alert('Las contraseñas / PIN no coinciden.');
                }
                const soporteUser = {
                    id: Date.now().toString(),
                    nombre: firstSetupForm.nombre.trim(),
                    username: firstSetupForm.username.trim(),
                    pin: firstSetupForm.pin.trim(),
                    email: firstSetupForm.email.trim(),
                    rol: 'soporte'
                };
                setUsers([soporteUser]);
                setCurrentUser(soporteUser);
                setActiveTab('config');
                setConfigSubTab('general');
                alert('Usuario Soporte creado exitosamente.');
            };

            const handleOlvidePassword = () => {
                if (confirm('¿Desea reiniciar el registro de usuarios? Esto vaciará la tabla para registrar nuevamente al usuario Soporte principal.')) {
                    setUsers([]);
                    localStorage.removeItem('adtech_users');
                    setFirstSetupForm({ nombre: '', username: '', pin: '', confirmPin: '', email: '' });
                }
            };

            // Handlers de POS
            const addToCart = (product) => {
                const usaSubmenu = product.tieneSubmenu || product.esPlatoDia;
                if (usaSubmenu) {
                    setActiveSubmenuProduct(product);
                    const initialConfig = { precio: product.esPlatoDia ? menuDiaConfig.precioBase : product.venta };
                    const activeKeys = (product.submenus && product.submenus.length > 0)
                        ? product.submenus
                        : (menuDiaConfig.submenusDinamicos ? Object.keys(menuDiaConfig.submenusDinamicos) : []);
                    activeKeys.forEach(k => { initialConfig[k] = ''; });
                    setPlatoConfig(initialConfig);
                    setShowPlatoModal(true);
                    return;
                }

                if (product.controlarStock && (product.stock || 0) <= 0) {
                    return alert(`El producto "${product.nombre}" está agotado en inventario.`);
                }

                if (product.precioEditable) {
                    const customPrice = prompt(`Ingrese el precio de venta para "${product.nombre}" (${negocioConfig.moneda || 'RD$'}):`, product.venta);
                    if (customPrice === null) return;
                    const finalPrice = Number(customPrice) || product.venta;
                    setCart([...cart, { id: product.id + '-' + Date.now(), productId: product.id, nombre: product.nombre, precio: finalPrice, cantidad: 1, controlarStock: product.controlarStock }]);
                    return;
                }

                const existing = cart.find(c => c.id === product.id);
                if (existing) {
                    if (product.controlarStock && existing.cantidad >= product.stock) {
                        return alert(`Stock insuficiente. Solo quedan ${product.stock} unidades disponibles.`);
                    }
                    setCart(cart.map(c => c.id === product.id ? { ...c, cantidad: c.cantidad + 1 } : c));
                } else {
                    setCart([...cart, { id: product.id, productId: product.id, nombre: product.nombre, precio: product.venta, cantidad: 1, controlarStock: product.controlarStock }]);
                }
            };

            const handleAddPlatoDia = () => {
                if (!activeSubmenuProduct) return;
                const detalles = [];
                Object.entries(platoConfig).forEach(([key, val]) => {
                    if (key !== 'precio' && val) detalles.push(val);
                });
                if (detalles.length === 0) return alert('Por favor seleccione al menos una opción.');

                const desc = `${activeSubmenuProduct.nombre} (${menuDate}): ${detalles.join(', ')}`;
                setCart([...cart, {
                    id: 'custom-' + Date.now(),
                    productId: activeSubmenuProduct.id,
                    nombre: desc,
                    precio: Number(platoConfig.precio) || (activeSubmenuProduct.esPlatoDia ? menuDiaConfig.precioBase : activeSubmenuProduct.venta),
                    cantidad: 1,
                    esCustom: true,
                    controlarStock: activeSubmenuProduct.controlarStock
                }]);
                setShowPlatoModal(false);
            };

            const handleClearInvoice = () => {
                if (cart.length === 0) return;
                if (confirm('¿Está seguro de que desea borrar la factura completa?')) {
                    setCart([]);
                    setDiscount(0);
                    setSelectedClient('1');
                    setPaymentMethod('Efectivo');
                }
            };

            const handleFacturar = () => {
                if (cart.length === 0) return alert('El carrito está vacío');
                const inventoryUpdated = products.map(p => ({ ...p }));
                for (let item of cart) {
                    if (item.productId) {
                        const prod = inventoryUpdated.find(p => p.id === item.productId);
                        if (prod && prod.controlarStock) {
                            if ((prod.stock || 0) < item.cantidad) {
                                return alert(`Stock insuficiente para "${prod.nombre}".`);
                            }
                            prod.stock -= item.cantidad;
                        }
                    }
                }
                setProducts(inventoryUpdated);

                const grossTotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
                const discountAmount = (grossTotal * discount) / 100;
                const total = grossTotal - discountAmount;
                const subtotal = total / (1 + (itbisRate / 100));
                const itbis = total - subtotal;

                const clientObj = clients.find(c => c.id === selectedClient) || { nombre: 'Cliente General' };
                const invoice = {
                    id: 'FAC-' + Math.floor(100000 + Math.random() * 900000),
                    ncf: ncfType + '00000123',
                    fecha: new Date().toLocaleString(),
                    cliente: clientObj.nombre,
                    rnc: clientObj.rnc,
                    metodoPago: paymentMethod,
                    items: [...cart],
                    subtotal,
                    discountAmount,
                    itbis,
                    total
                };

                if (paymentMethod === 'Credito') {
                    setClients(clients.map(c => c.id === selectedClient ? { ...c, cxc: (c.cxc || 0) + total } : c));
                }

                setLastInvoice(invoice);
                setShowReceipt(true);
                setCart([]);
            };

            const handleGuardarNuevoCliente = (nuevoClienteObj) => {
                setClients([...clients, nuevoClienteObj]);
                setSelectedClient(nuevoClienteObj.id);
                setShowClientModal(false);
            };

            // PANTALLA 1: REGISTRO INICIAL DE SOPORTE
            const hasSoporte = users.some(u => u.rol === 'soporte');
            if (!currentUser && (users.length === 0 || !hasSoporte)) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
                            <div className="text-center space-y-2">
                                <div className="inline-block bg-sky-500 text-white font-black px-4 py-1.5 rounded-xl text-2xl shadow">AdTech</div>
                                <div className="inline-flex items-center gap-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1 rounded-full text-xs font-bold">
                                    <Icon name="shield" size={14} /> Configuración Inicial del Sistema
                                </div>
                                <h1 className="text-xl font-bold text-white">Registrar Usuario Soporte</h1>
                                <p className="text-xs text-slate-400">
                                    No hay usuarios registrados. Cree el usuario <strong>Soporte</strong> (privilegio más alto) para configurar la empresa y administrar los demás usuarios.
                                </p>
                            </div>
                            <form onSubmit={handleInitialSoporteRegister} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Nombre Completo *</label>
                                    <input type="text" placeholder="Ej. Jackson Espinoza" value={firstSetupForm.nombre} onChange={e => setFirstSetupForm({ ...firstSetupForm, nombre: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Usuario de Acceso (Login) *</label>
                                    <input type="text" placeholder="Ej. soporte" value={firstSetupForm.username} onChange={e => setFirstSetupForm({ ...firstSetupForm, username: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico (Opcional)</label>
                                    <input type="email" placeholder="soporte@empresa.com" value={firstSetupForm.email} onChange={e => setFirstSetupForm({ ...firstSetupForm, email: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Contraseña / PIN *</label>
                                        <input type="password" placeholder="••••" value={firstSetupForm.pin} onChange={e => setFirstSetupForm({ ...firstSetupForm, pin: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Confirmar Clave *</label>
                                        <input type="password" placeholder="••••" value={firstSetupForm.confirmPin} onChange={e => setFirstSetupForm({ ...firstSetupForm, confirmPin: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                    </div>
                                </div>
                                <div className="bg-slate-900/60 border border-slate-700 p-3 rounded-xl text-xs text-slate-300 flex items-center justify-between">
                                    <span>Rol asignado automáticamente:</span>
                                    <span className="bg-amber-500 text-slate-900 font-black px-2.5 py-0.5 rounded uppercase text-[11px]">SOPORTE (TOTAL)</span>
                                </div>
                                <button type="submit" className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg">
                                    Registrar Soporte y Entrar
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // PANTALLA 2: LOGIN
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
                            <div className="text-center space-y-2">
                                <div className="inline-block bg-sky-500 text-white font-black px-4 py-1.5 rounded-xl text-2xl shadow">AdTech</div>
                                <h1 className="text-xl font-bold text-white">Iniciar Sesión</h1>
                                <p className="text-xs text-slate-400">Ingrese sus credenciales de acceso al sistema</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Usuario</label>
                                    <input type="text" placeholder="Ingrese su usuario..." value={loginForm.username} onChange={e => setLoginForm({ ...loginForm, username: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-300 mb-1">Contraseña / PIN</label>
                                    <input type="password" placeholder="••••" value={loginForm.pin} onChange={e => setLoginForm({ ...loginForm, pin: e.target.value })} className="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm outline-none focus:border-sky-500" required />
                                </div>
                                <button type="submit" className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg">
                                    Entrar al Sistema
                                </button>
                            </form>
                            <div className="flex justify-between items-center text-xs pt-2 border-t border-slate-700">
                                <button type="button" onClick={() => setShowLoginConfig(true)} className="text-sky-400 hover:underline flex items-center gap-1">
                                    <Icon name="settings" size={14} /> Tema Visual
                                </button>
                                <button type="button" onClick={handleOlvidePassword} className="text-amber-400 hover:underline">
                                    Reiniciar registro inicial
                                </button>
                            </div>
                        </div>

                        {showLoginConfig && (
                            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
                                    <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                        <h3 className="font-bold text-white text-sm">Apariencia</h3>
                                        <button onClick={() => setShowLoginConfig(false)} className="text-slate-400 hover:text-white"><Icon name="x" size={18} /></button>
                                    </div>
                                    <select value={theme} onChange={e => setTheme(e.target.value)} className="w-full p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white text-xs">
                                        <option value="light">Modo Claro (Light)</option>
                                        <option value="dark">Modo Oscuro (Dark)</option>
                                    </select>
                                    <button onClick={() => setShowLoginConfig(false)} className="w-full bg-sky-500 text-white font-bold py-2 rounded-xl text-xs">Guardar y Cerrar</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // PANTALLA 3: SHELL PRINCIPAL & ROUTING MODULAR
            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-sky-500 dark:bg-slate-800 text-white p-4 shadow-lg flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-white text-sky-600 font-black px-3 py-1 rounded-xl text-xl shadow">AdTech</div>
                            <span className="text-xs sm:text-sm font-light text-sky-100 border-l pl-3 border-sky-400">
                                {negocioConfig.nombreNegocio || 'Sistema POS Cafetería'}
                            </span>
                        </div>
                        <div className="flex items-center space-x-3">
                            <div className="text-xs bg-sky-600 dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-sky-400/30 flex items-center gap-2">
                                <Icon name="user" size={14} />
                                <span className="font-bold">{currentUser.nombre}</span>
                                <span className="bg-sky-700 dark:bg-slate-600 px-1.5 py-0.5 rounded text-[10px] uppercase font-mono">{currentUser.rol}</span>
                            </div>
                            <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Cambiar Tema">
                                <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                            </button>
                            {['soporte', 'admin'].includes(currentUser.rol) && (
                                <button onClick={() => setActiveTab('config')} className="p-2 rounded-lg bg-sky-600 dark:bg-slate-700 hover:bg-sky-700 transition" title="Configuración">
                                    <Icon name="settings" size={20} />
                                </button>
                            )}
                            <button onClick={() => setCurrentUser(null)} className="p-2 rounded-lg bg-red-600 hover:bg-red-700 transition" title="Cerrar Sesión">
                                <Icon name="log-out" size={20} />
                            </button>
                        </div>
                    </header>

                    <nav className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 flex space-x-4 overflow-x-auto">
                        {[
                            { id: 'pos', label: 'Facturación / POS', icon: 'shopping-cart', roles: ['soporte', 'admin', 'cajero'] },
                            { id: 'menudia', label: 'Menú del Día (Dinámico)', icon: 'utensils', roles: ['soporte', 'admin'] },
                            { id: 'inventory', label: 'Inventario & Productos', icon: 'grid', roles: ['soporte', 'admin'] },
                            { id: 'clients', label: 'Clientes & CxC', icon: 'users', roles: ['soporte', 'admin', 'cajero'] },
                            { id: 'suppliers', label: 'Proveedores & CxP', icon: 'truck', roles: ['soporte', 'admin'] },
                            { id: 'compras', label: 'Compras', icon: 'package', roles: ['soporte', 'admin'] },
                        ].filter(t => t.roles.includes(currentUser.rol)).map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center space-x-2 py-3 px-4 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${
                                    activeTab === tab.id
                                        ? 'border-sky-500 text-sky-600 dark:text-sky-400 font-bold'
                                        : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
                                }`}
                            >
                                <Icon name={tab.icon} size={16} />
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-4 max-w-7xl w-full mx-auto">
                        {activeTab === 'pos' && (
                            <PosModulo
                                products={products}
                                clients={clients}
                                negocioConfig={negocioConfig}
                                menuDiaConfig={menuDiaConfig}
                                cart={cart}
                                setCart={setCart}
                                selectedClient={selectedClient}
                                setSelectedClient={setSelectedClient}
                                paymentMethod={paymentMethod}
                                setPaymentMethod={setPaymentMethod}
                                ncfType={ncfType}
                                setNcfType={setNcfType}
                                discount={discount}
                                setDiscount={setDiscount}
                                itbisRate={itbisRate}
                                addToCart={addToCart}
                                handleClearInvoice={handleClearInvoice}
                                handleFacturar={handleFacturar}
                                setShowClientModal={setShowClientModal}
                            />
                        )}

                        {activeTab === 'menudia' && (
                            <MenuDiaModulo menuDiaConfig={menuDiaConfig} setMenuDiaConfig={setMenuDiaConfig} />
                        )}

                        {activeTab === 'inventory' && (
                            <InventarioModulo
                                products={products}
                                setProducts={setProducts}
                                negocioConfig={negocioConfig}
                                menuDiaConfig={menuDiaConfig}
                            />
                        )}

                        {activeTab === 'clients' && (
                            <ClientesModulo
                                clients={clients}
                                setClients={setClients}
                                negocioConfig={negocioConfig}
                                setShowClientModal={setShowClientModal}
                            />
                        )}

                        {activeTab === 'suppliers' && (
                            <ProveedoresModulo
                                suppliers={suppliers}
                                setSuppliers={setSuppliers}
                                negocioConfig={negocioConfig}
                            />
                        )}

                        {activeTab === 'compras' && (
                            <ComprasModulo onInventarioActualizado={setProducts} />
                        )}

                        {activeTab === 'config' && (
                            <div className="space-y-6">
                                <div className="flex justify-center border-b border-slate-200 dark:border-slate-700 max-w-xl mx-auto">
                                    <button onClick={() => setConfigSubTab('general')} className={`px-5 py-2.5 font-bold text-sm border-b-2 transition ${configSubTab === 'general' ? 'border-sky-500 text-sky-600 dark:text-sky-400' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                                        ⚙️ Datos del Negocio
                                    </button>
                                    <button onClick={() => setConfigSubTab('usuarios')} className={`px-5 py-2.5 font-bold text-sm border-b-2 transition ${configSubTab === 'usuarios' ? 'border-sky-500 text-sky-600 dark:text-sky-400' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                                        👥 Usuarios & Permisos
                                    </button>
                                    <button onClick={() => setConfigSubTab('datos')} className={`px-5 py-2.5 font-bold text-sm border-b-2 transition ${configSubTab === 'datos' ? 'border-sky-500 text-sky-600 dark:text-sky-400' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                                        📊 Almacenamiento & Respaldos
                                    </button>
                                </div>

                                {configSubTab === 'general' ? (
                                    <ConfiguracionGeneral config={negocioConfig} setConfig={setNegocioConfig} theme={theme} setTheme={setTheme} itbisRate={itbisRate} setItbisRate={setItbisRate} />
                                ) : configSubTab === 'usuarios' ? (
                                    <UsuariosModulo users={users} setUsers={setUsers} currentUser={currentUser} />
                                ) : (
                                    <ConfiguracionDatos />
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL SUBMENÚ EN FACTURACIÓN */}
                    {showPlatoModal && activeSubmenuProduct && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold">Armar {activeSubmenuProduct.nombre}</h3>
                                    <button onClick={() => setShowPlatoModal(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" size={20} /></button>
                                </div>

                                {(activeSubmenuProduct.precioEditable || activeSubmenuProduct.esPlatoDia) && (
                                    <div className="bg-sky-50 dark:bg-sky-900/30 p-3 rounded-xl border border-sky-200 dark:border-sky-800 flex items-center justify-between">
                                        <label className="text-xs font-bold text-sky-800 dark:text-sky-200">
                                            💲 Precio en Facturación ({negocioConfig.moneda || 'RD$'} con ITBIS):
                                        </label>
                                        <input
                                            type="number"
                                            value={platoConfig.precio || 0}
                                            onChange={e => setPlatoConfig({ ...platoConfig, precio: Number(e.target.value) })}
                                            className="w-28 p-2 bg-white dark:bg-slate-800 border border-sky-300 rounded-lg text-right font-bold text-sky-600 text-sm"
                                        />
                                    </div>
                                )}

                                <div className="space-y-4 max-h-[55vh] overflow-y-auto pr-1">
                                    {menuDiaConfig.submenusDinamicos && Object.entries(menuDiaConfig.submenusDinamicos)
                                        .filter(([key]) => !activeSubmenuProduct.submenus || activeSubmenuProduct.submenus.length === 0 || activeSubmenuProduct.submenus.includes(key))
                                        .map(([key, submenu]) => {
                                            const filteredItems = (submenu.elementos || []).filter(e => {
                                                if (e.disponible === false) return false;
                                                if (activeSubmenuProduct.opcionesPermitidas && activeSubmenuProduct.opcionesPermitidas.length > 0) {
                                                    return activeSubmenuProduct.opcionesPermitidas.includes(e.nombre);
                                                }
                                                return true;
                                            });
                                            if (filteredItems.length === 0) return null;
                                            return (
                                                <div key={key} className="space-y-1">
                                                    <label className="block text-xs font-bold text-slate-500 uppercase">{submenu.titulo}</label>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {filteredItems.map(item => (
                                                            <button
                                                                key={item.id}
                                                                type="button"
                                                                onClick={() => setPlatoConfig({ ...platoConfig, [key]: platoConfig[key] === item.nombre ? '' : item.nombre })}
                                                                className={`p-2.5 text-xs rounded-lg border font-medium text-left transition ${
                                                                    platoConfig[key] === item.nombre
                                                                        ? 'border-sky-500 bg-sky-50 text-sky-600 font-bold dark:bg-sky-900/40 dark:text-sky-300'
                                                                        : 'border-slate-200 dark:border-slate-700'
                                                                }`}
                                                            >
                                                                {item.nombre}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>

                                <button onClick={handleAddPlatoDia} className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition shadow-lg">
                                    Agregar al Carrito
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL TICKET / RECIBO */}
                    {showReceipt && lastInvoice && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white text-slate-900 rounded-xl max-w-sm w-full p-6 shadow-2xl relative font-mono text-xs">
                                <div id="printable-receipt" className="space-y-3 border p-4 rounded bg-slate-50">
                                    <div className="text-center">
                                        <h2 className="text-base font-black tracking-widest uppercase">{negocioConfig.nombreNegocio || 'CAFETERÍA ADTECH'}</h2>
                                        <p>RNC: {negocioConfig.rnc || '130999888'}</p>
                                        <p className="mt-2 font-bold">{lastInvoice.ncf}</p>
                                        <p className="text-[10px] text-slate-500">{lastInvoice.fecha}</p>
                                    </div>
                                    <div className="border-b border-t border-dashed border-slate-400 py-2 space-y-1">
                                        <p><strong>Cliente:</strong> {lastInvoice.cliente}</p>
                                        <p><strong>Pago:</strong> {lastInvoice.metodoPago}</p>
                                    </div>
                                    <div className="space-y-1">
                                        {lastInvoice.items.map((it, i) => (
                                            <div key={i} className="flex justify-between">
                                                <span>{it.cantidad}x {it.nombre}</span>
                                                <span>{negocioConfig.moneda || 'RD$'} {(it.precio * it.cantidad).toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="border-t border-dashed border-slate-400 pt-2 space-y-1 text-right">
                                        <div className="flex justify-between text-sm font-black">
                                            <span>TOTAL:</span>
                                            <span>{negocioConfig.moneda || 'RD$'} {lastInvoice.total.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-4 flex space-x-2">
                                    <button onClick={() => window.print()} className="flex-1 bg-sky-500 text-white font-bold py-2 rounded-lg text-sm">Imprimir</button>
                                    <button onClick={() => setShowReceipt(false)} className="flex-1 bg-slate-200 text-slate-800 font-bold py-2 rounded-lg text-sm">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL VERIFICAR / REGISTRAR CLIENTE */}
                    {showClientModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="my-8 w-full max-w-2xl">
                                <ClienteFormulario onGuardarCliente={handleGuardarNuevoCliente} onCancelar={() => setShowClientModal(false)} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
